<!--
================================================================================
G3 · ego 沉浸画布
================================================================================
【form 来自内容的哪里】
  ego 把工作区叫 Space；一个口播项目也是一个 Space —— 一期视频就是一间「拍摄现场」。
  所以每个 Space 有自己的一幅油画：第 2 期是书房里的三脚架（这一期就是在书房录的），
  第 1 期是花园露台的补光灯，「新建」是一间等待放映的小影院。
  整个工作台是铺在油画上的几扇 macOS 浮窗：切 Space = 换一幅画 + 换一组窗。
  剪辑过程不再是贴纸，而是 ego 招牌的「深色终端窗」叠在白窗上：
  被删的气口/口误先亮成浅蓝胶囊（ego 的关键短语高亮），然后轻轻上浮、虚化、消失，
  剩下的字合拢 —— 克制版的「剪掉」。

【ego 设计 DNA 对照表】（线上实测：Playwright 打开 lite.ego.app 读 computedStyle）
  字体      正文 system-ui / -apple-system / PingFang SC；
            点缀词 IBM Plex Serif Italic 200（ego 线上真实字体 ibmPlexSerif italic 200）
            → 用在：聊天窗大标题「剪成 1:57」的 1:57、版本号 v1/v2、Space 标题里的 (lite) 式括注、CTA 旁小注
            终端 IBM Plex Mono（ego 线上也加载了 IBM Plex Mono）
  标题      700 / 行高 1.05 / --text-1；括注斜体衬线 200 / --text-3
  色彩      --bg-1..5、--text-1..4、--brand-1..6、--accent 全部照抄 spec；
            唯一彩色 = 品牌蓝阶（高亮胶囊 brand-1 底 + brand-5 字；进度 brand-4；选中描边 glow-border #adc0eb）
            红黄绿三点只出现在窗口标题栏
  阴影      浮在画上的窗 = --shadow-3（0 0 0 1px #0000000f, 0 16px 48px #00000059）
            窗内卡片 = --shadow-1；大卡 = --shadow-2-1（0 8px 32px 4px #0000000f）
            深色浮层（终端 / 导出提示）= 0 25px 50px -12px rgba(0,0,0,.6)，底 rgba(0,0,0,.6)+模糊
  圆角      6（缩略图内角）/ 10（背景缩略图）/ 13（9:16 画面）/ 18（卡片）/ 26（窗口）/ 36（Space 坞）/ 胶囊
  按钮      主 CTA 黑底白字胶囊（导出、发送、开始出片）；次 CTA #eee 底胶囊；旁注斜体衬线
  公告条    顶部 --brand-1 整条 + 居中一句 + 黑色小胶囊按钮（用来播报 v3 合成进度）
  构图      印象派油画全幅铺底 + 白色 macOS 浮窗 + 深色终端窗叠放（ego hero 放大成 App）
  Spaces    ego 的 Space 隐喻 → 左侧 Space 坞，缩略图就是每个 Space 的油画

  对比度偏离说明：ego 正文用 --text-3（#0000007a，白底约 3.7:1），本稿 ≤16px 的正文改用
  #0000009e（约 6.2:1）以守住 4.5:1 底线；--text-3 只用于 ≥20px 的斜体衬线括注。

【动效】（framer-motion）全部临界阻尼或极小过冲，安静：
  窗口入场 y 24 → 0 依次浮起；Space 切换油画交叉淡化 + 1.06→1 缓推，窗组整体退场再入场；
  油画常驻 40s 往复的极慢推镜（Ken Burns 2%）；版本分段控件白色滑块 layoutId；
  @时间胶囊从点击处飞进输入框；终端里被删词胶囊 y -16 / blur 4px / 透明 退场，其余词 layout 合拢。

================================================================================
参考清单
================================================================================
1. lite.ego.app（Playwright 实测 + team-lead 给的 hero.png / sheet.jpg）——全部 DNA 来源，见上表。
2. SPEC-v3 资源沿用（上一轮 E 方向已逐一打开过，这里只列在本稿真正落地的）：
   - motion.dev/docs/react-scroll-animations：whileInView + viewport.root 让消息在聊天窗内滚入时浮起；
     聊天窗大标题随滚动位置收缩（离开底部=翻历史，标题让位，用 spring 过渡）。
   - prompt-motion.com「Shape morphing through UI states」："Springs everywhere, a tiny overshoot at most"、
     "Text that swaps inside a morphing container needs its own enter and exit timing"
     → 终端里被删词的退场与剩余词合拢分开计时；所有弹簧不过冲。
   - 60fps.design「Uber Search Border Highlight」→ 合成进度条上流动的蓝色 ripple；
     「CRED Autopay Bills Stack」→ 终端里分镜缩略图一张张叠出。
   - bentogrids.com → 设置卡展开后的四格、终端结尾的自检四格。
   - cta.gallery（Augustus：大标题 + 小黑按钮）→「新建」Space 的大标题 + 黑色「开始出片」。
   - navbar.gallery（Bud 的 AI 侧栏）→ 左侧极窄 Space 坞只放缩略图与新建。
   - footer.design（Playfolly：胶囊按钮收尾）→ 输入框下方快捷建议胶囊 + 一行花费小字。
   - styles.refero.design → 本轮锚点直接是 ego 本身（用户指定），未再另找。
   - unsection.com 仍被 Cloudflare 拦截；jiro.build 无可用风格提示词 —— 均未落地。
================================================================================
-->

            ))}
          </div>

                style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderRadius: 10, padding: '3px 10px', background: 'rgba(173,192,235,.14)', boxShadow: 'inset 0 0 0 1px rgba(173,192,235,.25)' }}>

        </div>
        {el >= T_END && (

            ✓ 删除 37 处气口 · 12 处口误 · 3:42 → 1:57 · 18 段 <span style={{ color: '#ffffff7a' }}>· 自检 8.8</span>
          </motion.div>
        )}
      </div>
    </motion.div>
  );
}

/* ---------- 细进度条（两个本版改动小点） ---------- */
function Progress({ time, setTime, version, playing, setPlaying, onPause }) {
  const ref = useRef();
  const drag = useRef(false);
  const [hover, setHover] = useState(null);
  const seek = (e) => { const r = ref.current.getBoundingClientRect(); setTime(Math.min(DUR - 0.01, Math.max(0, ((e.clientX - r.left) / r.width) * DUR))); };
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
      <motion.button data-act="play" whileTap={{ scale: 0.92 }} onClick={() => { if (playing) { setPlaying(false); onPause(); } else setPlaying(true); }}
        aria-label={playing ? '暂停' : '播放'} style={{ width: 34, height: 34, borderRadius: 999, background: '#000', display: 'grid', placeItems: 'center', flex: 'none' }}>
        {playing ? <svg width="10" height="12"><rect x="0.5" y="0.5" width="3" height="11" fill="#fff" /><rect x="6.5" y="0.5" width="3" height="11" fill="#fff" /></svg>
          : <svg width="11" height="12" viewBox="0 0 11 12"><path d="M1.5 1l8.5 5-8.5 5z" fill="#fff" /></svg>}
      </motion.button>
      <span className="tnum" style={{ fontSize: 13, color: T2, width: 92, flex: 'none' }}>{fmt(time)} <span style={{ color: T3A }}>/ 01:57</span></span>
      <div ref={ref} data-bar style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer' }}
        onPointerDown={(e) => { drag.current = true; e.currentTarget.setPointerCapture(e.pointerId); seek(e); }}
        onPointerMove={(e) => { const r = ref.current.getBoundingClientRect(); setHover(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))); if (drag.current) seek(e); }}
        onPointerUp={() => (drag.current = false)} onPointerLeave={() => setHover(null)}>
        <div style={{ position: 'absolute', left: 0, right: 0, top: 9, height: 4, borderRadius: 999, background: '#0000001a' }} />
        <div style={{ position: 'absolute', left: 0, top: 9, height: 4, borderRadius: 999, background: B4, width: `${(time / DUR) * 100}%` }} />
        {version >= 2 && SEGS.map((s, i) => s.v2 && (
          <span key={i} title={'v2 改动 · ' + s.v2} style={{ position: 'absolute', top: 7, left: `calc(${((s.t + segEnd(i)) / 2 / DUR) * 100}% - 4px)`, width: 8, height: 8, borderRadius: 999, background: B5, boxShadow: '0 0 0 2px #fff' }} />
        ))}
        <motion.span animate={{ scale: hover !== null || drag.current ? 1 : 0.6 }} transition={CRISP}
          style={{ position: 'absolute', top: 4, left: `calc(${(time / DUR) * 100}% - 7px)`, width: 14, height: 14, borderRadius: 999, background: '#fff', boxShadow: '0 0 0 1px #0000001f, 0 2px 6px rgba(0,0,0,.2)' }} />
        <AnimatePresence>{hover !== null && (
          <motion.div initial={{ opacity: 0, y: 4 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} transition={CRISP}
            style={{ position: 'absolute', bottom: 26, left: `clamp(0px, calc(${hover * 100}% - 70px), calc(100% - 150px))`, background: 'rgba(0,0,0,.6)', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', color: '#fff', fontSize: 12, padding: '4px 10px', borderRadius: 999, whiteSpace: 'nowrap', pointerEvents: 'none' }}>
            <span className="tnum">{fmt(hover * DUR)}</span> · {SEGS[segAt(hover * DUR)].tpl.split(' · ')[0]}
          </motion.div>
        )}</AnimatePresence>
      </div>
    </div>
  );
}

      </div>
    </div>
  );
}

    raf.current = requestAnimationFrame(loop);

  const toBottom = () => requestAnimationFrame(() => chatRef.current && chatRef.current.scrollTo({ top: chatRef.current.scrollHeight, behavior: 'smooth' }));

                  style={{ fontSize: 13, padding: '4px 12px', borderRadius: 999, background: compare ? B1 : BG4, color: compare ? B5 : T2, fontWeight: compare ? 600 : 400 }}>对比</button>
              </div>
              <div style={{ padding: '0 20px', display: 'flex', gap: 24, justifyContent: 'center' }}>
                {(compare ? [1, 2] : [version]).map((v) => (
                  <div key={compare ? 'c' + v : 'single'}>
                    {compare && <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span className="serif" style={{ fontSize: 24, fontWeight: 300 }}>v{v}</span>
                      <span style={{ fontSize: 12, color: T3A }}>{v === 2 && s.v2 ? <span className="hl" style={{ fontSize: 12 }}>{s.v2}</span> : `自检 ${scoreOf(seg, v)}`}</span>
                    </div>}
                    <motion.button data-player onClick={(e) => { setPlaying(false); pick(e.clientX, e.clientY, time); }} whileTap={{ scale: 0.99 }}
                      style={{ display: 'block', borderRadius: 13, overflow: 'hidden', boxShadow: SH1, cursor: 'copy' }}>
                      <Frame916 seg={seg} version={v} w={compare ? CPW : PW} processing={!compare && processing} />
                    </motion.button>
                  </div>
                ))}
              </div>
              <div style={{ padding: '14px 20px 16px' }}>
                <Progress time={time} setTime={setTime} version={version} playing={playing} setPlaying={setPlaying} onPause={() => pick(null, null, time)} />
              </div>
            </Win>

            {/* 这一段：小浮窗 */}
            <AnimatePresence>{!compare && (
              <Win key="seg" style={{ left: 1196, top: 470, width: 228 }} delay={0.3}>
                <div style={{ padding: '14px 16px 16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: T3A }}>
                    <span>第 {seg + 1} / 18 段</span><span className="tnum">{fmt(s.t)}–{fmt(segEnd(seg))}</span>
                  </div>
                  <AnimatePresence mode="wait" initial={false}>
                    <motion.div key={seg + '-' + version} initial={{ opacity: 0, y: 4 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -4 }} transition={{ duration: 0.16 }}>
                      <div style={{ fontSize: 16, fontWeight: 600, lineHeight: 1.45, margin: '6px 0 10px', minHeight: 46 }}>{s.text}</div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
                        <span style={{ fontSize: 12, color: T2, background: BG4, borderRadius: 999, padding: '1px 8px' }}>{s.tpl}</span>
                        <Score v={scoreOf(seg, version)} />
                      </div>
                    </motion.div>
                  </AnimatePresence>
                  <Pill data-act="quote" onClick={(e) => pick(e.clientX, e.clientY, time)} style={{ marginTop: 12, padding: '6px 0', fontSize: 13, width: '100%', justifyContent: 'center' }}>@ 引用这段到对话</Pill>
                  <div className="serif" style={{ fontSize: 17, color: T3, marginTop: 8, textAlign: 'center' }}>(或者直接点画面)</div>
                </div>
              </Win>
            )}</AnimatePresence>

            {/* 导出：黑色主 CTA + 菜单 */}
            <motion.div initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ ...CALM, delay: 0.35 }} style={{ position: 'absolute', right: 16, bottom: 16, zIndex: 25 }}>
              <Pill dark data-act="export" onClick={() => setExportOpen(!exportOpen)} style={{ padding: '10px 20px', fontSize: 15, boxShadow: FLOAT }}>
                <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.5v7M3 5.5l3.5 3.5L10 5.5M1.5 11.5h10" stroke="#fff" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>导出 v{version === 3 ? 2 : version}
              </Pill>
              <AnimatePresence>{exportOpen && (
                <motion.div className="glass" initial={{ opacity: 0, y: -6, scale: 0.97 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: -6, scale: 0.97 }} transition={CRISP}
                  style={{ position: 'absolute', right: 0, bottom: 52, width: 240, borderRadius: 18, boxShadow: SH3, padding: 6, transformOrigin: 'bottom right' }}>
                  {[['MP4', '1080×1920 · 1:57'], ['封面', '4:3 横版'], ['封面', '3:4 竖版']].map(([a, b], i) => (
                    <motion.button key={i} onClick={() => doExport(`${a} ${b}`)} whileHover={{ backgroundColor: '#d6dff5' }} transition={{ duration: 0.12 }}
                      style={{ width: '100%', display: 'flex', justifyContent: 'space-between', padding: '9px 12px', borderRadius: 13, fontSize: 14, backgroundColor: 'rgba(214,223,245,0)' }}>
                      <span style={{ fontWeight: 600 }}>{a}</span><span className="tnum" style={{ color: T3A }}>{b}</span>
                    </motion.button>
                  ))}
                </motion.div>
              )}</AnimatePresence>
            </motion.div>

            <AnimatePresence>{replay !== null && <Terminal key="term" el={replay} onClose={() => { cancelAnimationFrame(raf.current); setReplay(null); }} />}</AnimatePresence>
          </motion.div>
        )}
      </AnimatePresence>

      {/* 飞行中的 @时间胶囊 */}
      <AnimatePresence>{fly && (
        <motion.div key={fly.id} initial={{ x: fly.x0, y: fly.y0, scale: 1.15, opacity: 0.6 }} animate={{ x: fly.x1, y: fly.y1, scale: 1, opacity: 1 }} exit={{ opacity: 0, transition: { duration: 0 } }}
          transition={{ type: 'spring', stiffness: 200, damping: 26, restDelta: 0.5 }} onAnimationComplete={landFly}
          style={{ position: 'fixed', left: 0, top: 0, zIndex: 100, pointerEvents: 'none', borderRadius: 999, boxShadow: '0 8px 24px rgba(51,97,204,.3)' }}>
          <span className="hl" style={{ fontSize: 13, display: 'inline-block' }}>@{fly.label}</span>
        </motion.div>
      )}</AnimatePresence>
      <AnimatePresence>{toast && (
        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 12 }} transition={CALM}
          style={{ position: 'absolute', left: '50%', bottom: 28, marginLeft: -160, width: 320, textAlign: 'center', background: 'rgba(0,0,0,.6)', backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)', color: '#fff', borderRadius: 26, padding: '12px 20px', fontSize: 14, boxShadow: `0 0 0 1px #0000000f, 0 16px 48px 0 #00000059`, zIndex: 90 }}>
          已加入导出队列 · {toast}
        </motion.div>
      )}</AnimatePresence>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
