<html lang="zh-CN">
<head>
<!--
================================================================================
 明知AI剪辑 · 第四轮 · G1「ego 原味（浅色）」
================================================================================
 form 来自内容的哪里：
   ego 的招牌是「油画 + 白色浮窗 + 深色终端」——人在画里生活，agent 在终端里干活。
   放到口播剪辑上正好成立：博主的书房（油画）是成片诞生的地方，9:16 成片作为白色浮窗
   立在画上；AI 剪辑的过程是叠在白窗上的深色终端，逐行打出转录，把气口划掉。
   斜体衬线只给「结果」：3:42 → 1:57 里的 1:57、(只花 ¥3.84) 这类括号小注。

 ego 设计 DNA 对照表（token 抄自 lite.ego.app 线上 CSS，偏离处已注明）：
   字体   正文 system-ui / -apple-system / PingFang SC；标题 700、行高 1.0
          斜体衬线点缀 = IBM Plex Serif Italic 200（ego 的 --font-ibm 实测即此字体）
          中文点缀用 Noto Serif SC 300 直立（font-synthesis:none，防止伪斜体）
          终端 = IBM Plex Mono（ego 终端同款）
   背景   --bg-1 #fff / --bg-2 #f7f7f7 / --bg-3 #f5f5f5 / --bg-4 #eee / --bg-5 #e0e0e0
   文字   --text-1 #000000e6 / --text-2 #000000b3 / --text-4 #0000003d
          偏离：--text-3 由 #0000007a 加深到 #0000008f（白底 3.7:1 → 4.9:1，满足 ≥4.5）
   品牌蓝 --brand-1..6、--accent #5c81d6、--glow-border #adc0eb、--negative #d65c5c
          偏离：胶囊高亮里的字用 --brand-6 #294ea3（brand-1 底上 5.8:1），ego 原用 brand-5（4.2:1）
   阴影   --shadow-1 / --shadow-2-1 / --shadow-3 / 浮窗 0 25px 50px -12px rgba(0,0,0,.6) 原样
   圆角   6 / 10 / 13 / 18 / 26 / 36；按钮全部胶囊
   构图   顶部 --brand-1 公告条 + 黑色小胶囊；油画画框 + 白色 macOS 浮窗（红黄绿）+ 深色终端叠放
          关键短语浅蓝胶囊；主 CTA 黑底白字胶囊 + 斜体小注；次 CTA #eee 灰胶囊
          项目 = ego 的 Space（带缩略图的工作区）
   油画   assets/art/01-studio.png（预览画框）、02-garden.png / 03-cinema.png（Space 缩略图）

 参考清单：
   0. lite.ego.app —— 本轮主参照。WebFetch 读结构与文案；curl 抓 CSS 确认
      --font-ibm = ibmPlexSerif、终端 IBM Plex Mono、圆角分布（32/12/26/36/10…）
      借：括号小注「(yes, free)」句式 → 「(只花 ¥3.84)」「(本轮约 ¥0.12)」；
          「Space for agents, Space for you」→ 左栏项目即 Space；终端窗「Terminal — 100×30」标题格式
   以下为 SPEC-v3 的 10 个资源，上一轮（D 方向）已实际打开过，本轮复用其结论：
   1. motion.dev/docs/react-scroll-animations：whileInView + viewport.root（对话流条目进入）、
      useScroll + useSpring（对话流顶部的细进度线）
   2. 60fps.design：Revolut 计数动效 → 「3:42 → 1:57」滚动计数；Uber 搜索框描边高亮 → 输入框聚焦蓝色 glow；
      Platen 打字机 → 终端逐行打出
   3. styles.refero.design（curl 抓到 TE 页）：本轮只借「颜色配给」原则——全页只有蓝阶一个彩色
   4. bentogrids.com（只拿到条目名）：设置卡展开后的不等宽格
   5. navbar.gallery（只拿到站点名）：顶部公告条 + 无图标导航，借鉴有限
   6. cta.gallery（只拿到名称）：主 CTA 黑胶囊 + 斜体小注，原则级借鉴
   7. footer.design（只拿到筛选项 Small Type）：输入框下方小字收尾
   8. jiro.build（拿到组件描述）：本轮未直接使用
   9. prompt-motion.com —— 403，未参考
  10. unsection.com     —— 403，未参考
================================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明知AI剪辑 · 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@1,200;1,300&family=Noto+Serif+SC:wght@300&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#fff; --bg-2:#f7f7f7; --bg-3:#f5f5f5; --bg-4:#eee; --bg-5:#e0e0e0;
  --text-1:#000000e6; --text-2:#000000b3; --text-3:#0000008f; --text-4:#0000003d;
  --brand-1:#d6dff5; --brand-2:#adc0eb; --brand-3:#85a0e0; --brand-4:#5c81d6; --brand-5:#3361cc; --brand-6:#294ea3;
  --accent:#5c81d6; --accent-light:#d6dff5; --accent-dark:#2e57b8; --negative:#d65c5c;
  --glow-border:#adc0eb;
  --shadow-1:0 0 0 1px #0000000f;
  --shadow-2-1:0 8px 32px 4px #0000000f;
  --shadow-3:0 0 0 1px #0000000f, 0 16px 48px 0 #00000059;
  --shadow-win:0 0 0 1px #0000000f, 0 25px 50px -12px rgba(0,0,0,.6);
  --sans:system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  --serif-i:"IBM Plex Serif", "Noto Serif SC", ui-serif, Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --term:#1f1f22; --term-bar:#2a2a2e; --term-1:#e8e8ea; --term-2:#a3a3a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-2);color:var(--text-1);overflow:hidden}
body{font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
/* 斜体衬线点缀：拉丁/数字用 Plex Serif 斜体，中文用宋体直立 */
.it{font-family:var(--serif-i);font-style:italic;font-weight:200;font-synthesis:none;letter-spacing:-.005em}
.it.l{font-weight:300}
.hl{display:inline;background:var(--brand-1);color:var(--brand-6);font-weight:600;border-radius:8px;padding:1px 7px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- 胶囊按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;font:500 14px/1 var(--sans);padding:9px 15px;white-space:nowrap;transition:background .15s, box-shadow .15s, color .15s}
.btn svg{width:15px;height:15px;flex:none}
.btn-k{background:#000;color:#fff}
.btn-k:hover{background:#262626}
.btn-g{background:var(--bg-4);color:var(--text-2)}
.btn-g:hover{background:var(--bg-5);color:var(--text-1)}
.btn-w{background:#fff;color:var(--text-1);box-shadow:var(--shadow-1)}
.btn-w:hover{box-shadow:0 0 0 1px #0000001f}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-rows:40px 1fr;height:100vh;min-height:860px}
.bar{background:var(--brand-1);display:flex;align-items:center;justify-content:center;gap:12px;font:400 14px/1 var(--sans);color:var(--text-1)}
.bar .btn{padding:6px 11px;font-size:13px}
.main{display:grid;grid-template-columns:64px 568px 1fr;min-height:0}

/* ---------- Space 栏 ---------- */
.rail{background:var(--bg-3);box-shadow:inset -1px 0 0 #0000000f;display:flex;flex-direction:column;align-items:center;padding:16px 0 16px;position:relative;z-index:20}
.mark{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font:700 15px/1 var(--sans)}
.rail-cap{font:500 12px/1 var(--sans);color:var(--text-3);margin:22px 0 10px}
.space{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.space .th{width:42px;height:42px;border-radius:13px;background-size:cover;background-position:center;box-shadow:var(--shadow-1);transition:box-shadow .2s, transform .2s}
.space.on .th{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--glow-border)}
.space:hover .th{transform:translateY(-1px)}
.space span{font:500 12px/1 var(--sans);color:var(--text-3)}
.space.on span{color:var(--text-1)}
.fly{position:absolute;left:54px;top:4px;white-space:nowrap;background:#fff;border-radius:13px;box-shadow:var(--shadow-3);padding:10px 12px;font:500 14px/1.3 var(--sans);pointer-events:none;text-align:left}
.fly small{display:block;font:400 12px/1.4 var(--sans);color:var(--text-3);margin-top:3px}
.rail-new{margin-top:auto;width:42px;height:42px;border-radius:13px;background:var(--bg-4);display:grid;place-items:center;color:var(--text-2);font:300 22px/1 var(--sans);transition:background .15s}
.rail-new:hover{background:var(--bg-5)}

/* ---------- 对话 ---------- */
.chat{background:var(--bg-1);box-shadow:inset -1px 0 0 #0000000f;display:flex;flex-direction:column;min-height:0;position:relative}
.chat-head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:18px 28px 14px;position:relative;z-index:2}
.chat-head h1{font:700 28px/1.05 var(--sans);letter-spacing:-.01em;color:var(--text-1)}
.chat-head h1 .it{font-weight:300;color:var(--text-2);font-size:27px}
.chat-head .sub{font:400 13px/1 var(--sans);color:var(--text-3);margin-top:9px}
.stream{flex:1;min-height:0;overflow-y:auto;padding:16px 28px 28px;scrollbar-width:thin;scrollbar-color:#0000001f transparent}
.msg{margin-bottom:22px}
.msg.user{display:flex;justify-content:flex-end}
.bubble{max-width:86%;background:var(--bg-4);border-radius:18px 18px 6px 18px;padding:11px 15px;font:400 15px/1.6 var(--sans);color:var(--text-1);text-wrap:pretty}
.bubble .hl{margin-right:4px}
.who{display:flex;align-items:center;gap:8px;font:500 13px/1 var(--sans);color:var(--text-3);margin-bottom:10px}
.who i{width:20px;height:20px;border-radius:50%;background:#000;color:#fff;font:700 12px/20px var(--sans);text-align:center;font-style:normal}
.say{font:400 15px/1.7 var(--sans);color:var(--text-2);text-wrap:pretty}
.say + .say{margin-top:8px}
.card{background:var(--bg-1);border-radius:18px;box-shadow:var(--shadow-1), var(--shadow-2-1)}

/* 设置卡 */
.setup{width:100%;display:flex;align-items:center;gap:8px;padding:12px 16px;text-align:left;font:400 14px/1.3 var(--sans);color:var(--text-2)}
.setup b{font-weight:600;color:var(--text-1)}
.setup .dot{color:var(--text-4)}
.setup .more{margin-left:auto;color:var(--text-3);font-size:13px}
.setup-body{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;padding:0 12px 12px}
.cell{background:var(--bg-3);border-radius:13px;padding:12px;min-width:0}
.cell .k{font:400 12px/1 var(--sans);color:var(--text-3);margin-bottom:9px}
.cell .v{font:600 15px/1.35 var(--sans);color:var(--text-1)}
.cell .m{font:400 13px/1.5 var(--sans);color:var(--text-3);margin-top:4px}
.cell.bg{display:flex;gap:10px;align-items:center}
.cell.bg img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.subpv{font:900 16px/1.2 "PingFang SC", var(--sans);color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;white-space:nowrap}
.subpv span{color:#ffd23f}

/* 剪辑直播：白窗 + 深色终端叠放 */
.live{position:relative;padding-bottom:4px}
.win{background:#fff;border-radius:26px;box-shadow:var(--shadow-1), var(--shadow-2-1);overflow:hidden}
.titlebar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;position:relative}
.lights{display:flex;gap:7px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;position:relative}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.lights:hover i:after{position:absolute;inset:0;font:700 9px/12px var(--sans);text-align:center;color:#0000008c}
.lights:hover i:nth-child(1):after{content:'×'}.lights:hover i:nth-child(2):after{content:'–'}.lights:hover i:nth-child(3):after{content:'+'}
.titlebar .tt{position:absolute;left:0;right:0;text-align:center;font:500 13px/1 var(--sans);color:var(--text-3);pointer-events:none}
.titlebar .r{margin-left:auto;position:relative;z-index:1}
.live-top{padding:2px 22px 66px}
.big{font:700 46px/1 var(--sans);letter-spacing:-.02em;color:var(--text-1);display:flex;align-items:baseline;gap:12px}
.big .arr{font:200 34px/1 var(--serif-i);font-style:italic;color:var(--text-3)}
.big .it{font-size:52px;color:var(--brand-6)}
.live-sum{font:400 15px/1.9 var(--sans);color:var(--text-2);margin-top:8px}
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-top:14px}
.strip .s{aspect-ratio:9/16;border-radius:5px;background:var(--bg-4);overflow:hidden;position:relative}
.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}
.sc .k{font:400 13px/1 var(--sans);color:var(--text-3)}
.sc .v{font:600 20px/1 var(--sans);margin-top:8px;color:var(--text-1)}
.sc .tr{height:3px;border-radius:2px;background:var(--bg-4);margin-top:8px;overflow:hidden}
.sc .tr i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;border-radius:2px}
.term{position:relative;margin:-58px 0 0 26px;background:var(--term);border-radius:18px;box-shadow:var(--shadow-win);overflow:hidden;color:var(--term-1)}
.term .titlebar{height:32px;background:var(--term-bar)}
.term .titlebar .tt{color:var(--term-2);font:400 12px/1 var(--mono)}
.term .lights i{width:10px;height:10px}
.term-body{padding:12px 16px 14px;font:400 12.5px/1.7 var(--mono);height:236px;overflow:hidden;position:relative}
.term-body .ln{white-space:nowrap;overflow:hidden}
.term-body .p{color:var(--brand-2)}
.term-body .d{color:var(--term-2)}
.term-body .ok{color:var(--brand-2)}
.term-body .sp{color:#febc2e}
.term-body .tx{padding-left:18px;color:var(--term-1);font-family:var(--sans);font-size:13px}
.cutw{display:inline-flex;vertical-align:bottom;overflow:hidden;white-space:nowrap}
.cutw span{color:var(--negative);text-decoration:line-through;text-decoration-thickness:1.5px}
.term-body .caret{display:inline-block;width:7px;height:14px;background:var(--term-1);vertical-align:-2px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* 版本卡 */
.ver{display:grid;grid-template-columns:62px 1fr;gap:16px;padding:14px 16px 14px 14px;align-items:center}
.ver img{width:62px;height:110px;border-radius:10px;object-fit:cover;box-shadow:var(--shadow-1)}
.ver .vt{font:700 24px/1 var(--sans);display:flex;align-items:baseline;gap:8px}
.ver .vt .it{font-size:17px;color:var(--text-3);font-weight:300}
.ver .facts{display:flex;gap:18px;margin-top:12px}
.ver .facts b{display:block;font:600 16px/1 var(--sans);color:var(--text-1)}
.ver .facts span{display:block;font:400 12px/1 var(--sans);color:var(--text-3);margin-top:6px}
.ver .acts{display:flex;gap:8px;margin-top:14px}
.ver .acts .btn{padding:7px 13px;font-size:13px}
.ver .now{font:500 12px/1 var(--sans);color:var(--brand-6);background:var(--brand-1);border-radius:999px;padding:4px 8px}

/* AI 回复 */
.cites{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.cite{display:flex;gap:10px;align-items:flex-start;background:var(--bg-3);border-radius:13px;padding:10px}
.cite img{width:38px;height:68px;border-radius:6px;object-fit:cover;flex:none}
.cite .hl{font-size:13px}
.cite p{font:400 13px/1.55 var(--sans);color:var(--text-2);margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.opt{position:relative;text-align:left;background:#fff;border-radius:13px;box-shadow:var(--shadow-1);padding:8px;transition:box-shadow .2s}
.opt:hover{box-shadow:0 0 0 1px #00000024, var(--shadow-2-1)}
.opt.sel{box-shadow:0 0 0 2px var(--accent), 0 0 0 5px var(--brand-1)}
.opt .pv{height:62px;border-radius:9px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.opt .nm{display:flex;justify-content:space-between;align-items:center;font:500 13px/1 var(--sans);color:var(--text-1)}
.opt .nm .it{font-size:15px;color:var(--text-3)}
.pv-a{display:flex;flex-direction:column;gap:7px;width:74%}
.pv-a i{display:block;height:8px;border-radius:4px;background:var(--brand-2)}
.pv-a i.o{background:var(--accent)}
.ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--accent) 0 38%,var(--brand-1) 38% 100%);position:relative}
.ring:after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--bg-3)}
.pv-b{display:flex;align-items:center;gap:10px}
.pv-b .ln{display:flex;flex-direction:column;gap:5px}
.pv-b .ln i{display:block;height:5px;border-radius:3px;background:var(--text-4)}
.pv-c{display:grid;grid-template-columns:repeat(10,5px);gap:3px}
.pv-c i{width:5px;height:5px;border-radius:50%;background:var(--bg-5)}
.pv-c i.o{background:var(--accent)}
.picked{margin-top:10px;font:400 13px/1 var(--sans);color:var(--text-3)}

/* 处理中 */
.proc-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.proc-h b{font:600 15px/1 var(--sans)}
.proc-h .it{font-size:15px;color:var(--text-3)}
.bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 16px 4px}
.bgt{position:relative;text-align:left}
.bgt .im{position:relative;border-radius:10px;overflow:hidden;height:52px;box-shadow:var(--shadow-1)}
.bgt img{width:100%;height:100%;object-fit:cover}
.bgt .nm{display:block;font:400 12px/1 var(--sans);color:var(--text-3);margin-top:6px;white-space:nowrap}
.bgt.sel .im{box-shadow:0 0 0 2px var(--accent), 0 0 0 5px var(--brand-1)}
.bgt.sel .nm{color:var(--brand-6);font-weight:600}
.bgt .shim{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(214,223,245,.75) 50%,transparent 70%);background-size:250% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.prog{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}
.prog .t{font:500 14px/1 var(--sans);white-space:nowrap}
.track{flex:1;height:4px;border-radius:2px;background:var(--bg-4);overflow:hidden;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.track i:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:shim2 1.4s linear infinite}
@keyframes shim2{from{background-position:-60% 0}to{background-position:160% 0}}
.prog .pct{font:600 15px/1 var(--sans);min-width:38px;text-align:right}
.proc-f{display:flex;justify-content:space-between;padding:8px 16px 14px;font:400 13px/1 var(--sans);color:var(--text-3)}

/* 输入框 */
.composer{flex:none;padding:6px 20px 14px}
.box{background:#fff;border-radius:26px;box-shadow:var(--shadow-1), var(--shadow-2-1);transition:box-shadow .2s;padding:6px 8px 8px}
.box.focus{box-shadow:0 0 0 1px var(--glow-border), 0 0 0 5px #d6dff599, var(--shadow-2-1)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 0;min-height:6px}
.tags .hl{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 6px 4px 9px;border-radius:999px}
.tags .hl button{width:16px;height:16px;border-radius:50%;font:500 12px/16px var(--sans);color:var(--brand-6)}
.tags .hl button:hover{background:#fff8}
.box textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;font:400 15px/1.55 var(--sans);color:var(--text-1);padding:8px 10px 4px;height:50px}
.box textarea::placeholder{color:var(--text-3)}

            const p = clamp(scP * 4 - i * .7);
            return <div className="sc" key={k}><div className="k">{k}</div><div className="v">{p > 0 ? (v * p).toFixed(1) : '—'}</div><div className="tr"><motion.i initial={false} animate={{ scaleX: p * v / 10 }} transition={SOFT} /></div></div>;
          })}</div>
        </div>
      </div>
      <div className="term">
        <div className="titlebar"><Lights /><span className="tt">Terminal — 剪辑直播 — 100×30</span></div>
        <div className="term-body" ref={bodyRef}>
          {shown.map((l, k) => {
            if (l.type === 'cmd') return <div className="ln" key={k}><span className="p">$ </span>{l.text}</div>;
            if (l.type === 'stage') {
              const run = running(l.i);
              return <div className="ln" key={k}>{run ? <span className="sp">{SPIN[Math.floor((rt || 0) * 12) % 10]} </span> : <span className="ok">✓ </span>}{l.k}  <span className="d">{l.d}{run ? '' : ' · ' + l.tm}</span></div>;
            }
            if (l.type === 'tx') {
              txIdx += 1;
              const cutAt = ST[1] + .3 + txIdx * .6;
              return <div className="ln tx" key={k}><span className="d">⎿ </span>{l.parts.map((p, j) => p.cut
                ? <CutW key={j} text={p.t} struck={fin || rt >= cutAt} gone={fin || rt >= cutAt + .7} />
                : <span key={j}>{p.t}</span>)}</div>;
            }
            return <div className="ln" key={k}><span className="p">→ </span>{l.text}</div>;
          })}
          {fin ? <div className="ln"><span className="p">$ </span><span className="caret" /></div> : null}
        </div>
      </div>
    </div>
  );
}

function Version({ v, img, aside, facts, active, onPreview, onExport }) {
  return (
    <div className="card ver">
      <img src={img} alt={v + ' 首帧'} />
      <div>
        <div className="vt">{v}<span className="it">{aside}</span>{active && <span className="now">预览中</span>}</div>
        <div className="facts">{facts.map(([b, s]) => <div key={s}><b>{b}</b><span>{s}</span></div>)}</div>
        <div className="acts">
          <Tap className="btn btn-g" onClick={onPreview}>预览</Tap>
          <Tap className="btn btn-k" onClick={onExport}>{Ico.down}导出</Tap>
        </div>
      </div>
    </div>
  );
}

function Reply({ choice, setChoice }) {
  const opts = [
    { n:'A', name:'双横条', pv:<div className="pv-a"><i style={{ width:'52%' }} /><i className="o" style={{ width:'90%' }} /></div> },
    { n:'B', name:'环形占比', pv:<div className="pv-b"><span className="ring" /><span className="ln"><i style={{ width:34 }} /><i style={{ width:22 }} /><i style={{ width:28 }} /></span></div> },
    { n:'C', name:'百人点阵', pv:<div className="pv-c">{Array.from({ length:30 }, (_, i) => <i key={i} className={i % 10 < 4 ? 'o' : ''} />)}</div> },
  ];
  return (
    <>
      <Who>明知</Who>
      <p className="say">明白，改两处，<span className="hl">只重渲这 2 段</span>，其余 16 段原样复用：</p>
      <div className="cites">
        <div className="cite"><img src={F('062')} alt="" /><div><span className="hl">@00:58 对比条卡</span><p>补上两组的具体比例，数字直接标在条上</p></div></div>
        <div className="cite"><img src={F('003')} alt="" /><div><span className="hl">@00:04 钩子卡 2/3</span><p>「¥0.51」放大到 1.6 倍，其余字收小一级</p></div></div>
      </div>
      <p className="say">对比条卡想要哪种版式？</p>
      <div className="opts">{opts.map((o, i) => (
        <motion.button key={o.n} className={'opt' + (choice === i ? ' sel' : '')} onClick={() => setChoice(i)} whileHover={{ y:-2 }} whileTap={{ scale:.98 }} transition={SPRING}>
          <div className="pv">{o.pv}</div>
          <div className="nm"><span>{o.name}</span><span className="it">{o.n}</span></div>

      ))}</div>
      <div className="picked">已选 {opts[choice].n} · {opts[choice].name}</div>
    </>
  );
}

function Processing() {
  const pct = 62;
  return (
    <>
      <Who>明知 · 处理中</Who>
      <div className="card">
        <div className="proc-h"><b>换背景 → 夜景落地窗</b><span className="it">(分镜与字幕全部复用)</span></div>
        <div className="bgs">{BGS.map(b => {
          const sel = b.id === '04-night-window';

            <div key={b.id} className={'bgt' + (sel ? ' sel' : '')}>
              <div className="im"><img src={b.src} alt={b.name} />{sel && <span className="shim" />}</div>
              <span className="nm">{b.name}{b.id === '01-study' ? ' · 当前' : ''}</span>
            </div>
          );
        })}</div>
        <div className="prog"><span className="t">抠像合成中</span><span className="track"><motion.i initial={false} animate={{ width:`${pct}%` }} transition={SOFT} /></span><span className="pct">{pct}%</span></div>
        <div className="proc-f"><span>正在应用到人像 · 18 段</span><span>已用 0:41 · 预计 +¥0.21</span></div>
      </div>

}

function Chat({ rt, onReplay, version, setVersion, choice, setChoice, extra, onExport, streamRef, composer }) {
  // 顶部阴影随对话流滚动出现（motion useScroll + useTransform）
  const { scrollY, scrollYProgress } = useScroll({ container: streamRef });
  const shade = useTransform(scrollY, [0, 24], [0, 1]);
  const lift = useTransform(scrollYProgress, [.97, 1], [1, 0]);
  const shadow = useTransform([shade, lift], ([a, b]) => `0 1px 0 rgba(0,0,0,${.06 * a}), 0 10px 24px -14px rgba(0,0,0,${.35 * a * Math.max(b, .5)})`);
  return (
    <section className="chat">
      <motion.header className="chat-head" style={{ boxShadow: shadow }}>
        <div>
          <h1>高性价比人生指南 <span className="it">(第 2 期)</span></h1>
          <div className="sub">18 段 · 1:57 · 已花 ¥4.00 / 上限 ¥10</div>
        </div>
        <Tap className="btn btn-g">设置</Tap>
      </motion.header>
      <div className="stream" ref={streamRef}>
        <Msg root={streamRef}><div style={{ width:'100%' }}><Setup /></div></Msg>
        <Msg root={streamRef} id="live"><Who>明知 · 剪辑直播</Who><Live rt={rt} onReplay={onReplay} /></Msg>
        <Msg root={streamRef}><Version v="v1" aside="(首版)" img={F('003')} active={version === 'v1'} onPreview={() => setVersion('v1')} onExport={onExport}
          facts={[['1:57','时长'],['8.8','自检'],['¥3.84','花费']]} /></Msg>
        <Msg user root={streamRef}><div className="bubble"><span className="hl">@00:58 对比条卡</span>这张数据太弱了，加上具体比例，再把开头第二张钩子卡的 ¥0.51 放大</div></Msg>
        <Msg root={streamRef}><Reply choice={choice} setChoice={setChoice} /></Msg>
        <Msg root={streamRef}><Version v="v2" aside="(只重渲了 2 段)" img={F('062')} active={version === 'v2'} onPreview={() => setVersion('v2')} onExport={onExport}
          facts={[['0:38','耗时'],['+¥0.16','花费'],['9.0','自检 ↑0.2']]} /></Msg>
        <Msg user root={streamRef}><div className="bubble">背景换成夜景落地窗试试</div></Msg>
        <Msg root={streamRef}><Processing /></Msg>
        <AnimatePresence>{extra.map((m, i) => (
          <Msg key={i} user={m.io === 'in'} root={streamRef}>
            {m.io === 'in'
              ? <div className="bubble">{m.tags.map(t => <span key={t.label} className="hl">@{t.time} {t.card}</span>)}{m.text}</div>
              : <><Who>明知</Who><p className="say">{m.text}</p></>}
          </Msg>
        ))}</AnimatePresence>
      </div>
      {composer}
    </section>
  );
}

function Composer({ tags, setTags, draft, setDraft, onSend, onChip, tagRef }) {
  const [focus, setFocus] = useState(false);
  const est = draft.trim() || tags.length ? '约 ¥0.12' : '—';
  return (
    <div className="composer">
      <div className={'box' + (focus ? ' focus' : '')}>
        <div className="tags" ref={tagRef}>
          <AnimatePresence>{tags.map(t => (
            <motion.span layout key={t.label} className="hl" initial={{ opacity:0, scale:.7 }} animate={{ opacity:1, scale:1 }} exit={{ opacity:0, scale:.7 }} transition={SPRING}>
              @{t.time} {t.card}<button aria-label="移除" onClick={() => setTags(ts => ts.filter(x => x.label !== t.label))}>×</button>
            </motion.span>
          ))}</AnimatePresence>
        </div>
        <textarea value={draft} onChange={e => setDraft(e.target.value)} onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } }}
          placeholder="说一句话修改，例如「这张换成对比图」" />
        <div className="box-f">
          {['节奏再快一点', '换一张 B-roll', '字幕换成得意黑', '导出'].map(c => (
            <motion.button key={c} className="chip" whileHover={{ y:-1 }} whileTap={{ scale:.96 }} transition={SPRING} onClick={() => onChip(c)}>{c}</motion.button>
          ))}
          <Tap className="send" aria-label="发送" onClick={onSend}>{Ico.up}</Tap>
        </div>
      </div>
      <div className="foot"><span>点预览画面，可插入 @时间</span><span>本轮预估 <span className="it">({est})</span></span></div>
    </div>
  );
}

/* ================= 预览：油画画框 + 白色浮窗 + 终端 ================= */
function VersionSeg({ version, setVersion, notify }) {
  const refs = { v1:useRef(null), v2:useRef(null) };
  const [box, setBox] = useState(null);
  useLayoutEffect(() => { const el = refs[version].current; if (el) setBox({ left: el.offsetLeft, width: el.offsetWidth }); }, [version]);
  return (
    <div className="seg">
      {box && <motion.span className="pill" initial={false} animate={box} transition={SPRING} />}
      {['v1', 'v2'].map(v => <button key={v} ref={refs[v]} className={version === v ? 'cur' : ''} onClick={() => setVersion(v)}>{v}</button>)}
      <button aria-disabled="true" onClick={() => notify('v3 正在换背景，合成完成后可切换')}><span className="pulse" />v3</button>
    </div>
  );
}

function Player({ ver, seg, t, h, playing, setPlaying, onSeek, onShot, replaying, compare }) {
  const g = SEGS[seg], w = Math.round(h * 9 / 16);
  const vi = ver === 'v1' ? 0 : 1;
  return (
    <motion.div layout className="player" style={{ width: w + 16 }} initial={{ opacity:0, y:20, scale:.97 }} animate={{ opacity:1, y:0, scale:1 }} exit={{ opacity:0, scale:.97 }} transition={SOFT}>
      <div className="titlebar"><Lights /><span className="tt">{ver} — {fmt(g.s)} {g.card}</span></div>
      <div className="vid" style={{ height:h }} onClick={e => onShot(e, g)}>
        <AnimatePresence initial={false}>
          <motion.img key={g.f} src={F(g.f)} alt={g.text} initial={{ opacity:0 }} animate={{ opacity:1 }} exit={{ opacity:0 }} transition={{ duration:.2 }} />
        </AnimatePresence>
        {ver === 'v2' && g.chg && <span className="hl badge" style={{ fontSize:12 }}>本版改动</span>}
        {!replaying && <span className="tip">点一下，插入 @{fmt(g.s)} {g.card}</span>}
      </div>
      <div className="pctl">
        <Tap className="pbtn" aria-label={playing ? '暂停' : '播放'} onClick={() => setPlaying(p => !p)}>{playing ? Ico.pause : Ico.play}</Tap>
        <span className="ptime"><b>{fmt(t)}</b> / {fmt(TOTAL)}</span>
        <div className="pbar" onClick={e => { const r = e.currentTarget.getBoundingClientRect(); onSeek((e.clientX - r.left) / r.width * TOTAL); }}>
          <span className="f" style={{ width:`${t / TOTAL * 100}%` }} />
          {ver === 'v2' && SEGS.filter(s => s.chg).map(s => <span key={s.s} className="chg" style={{ left:`${(s.s + 1) / TOTAL * 100}%` }} title={'本版改动 · ' + s.card} />)}
          <span className="kb" style={{ left:`${t / TOTAL * 100}%` }} />
        </div>
      </div>
      <div className="pmeta"><span>{g.card} · 第 {seg + 1}/18 段</span><span>本段自检 <b>{g.sc[vi].toFixed(1)}</b></span></div>
    </motion.div>
  );
}

function Pane({ version, setVersion, compare, setCompare, t, seg, playing, setPlaying, onSeek, onShot, exportOpen, setExportOpen, onExportPick, rt, notify }) {
  const replaying = rt !== null;
  const V = VERS[version];
  return (
    <section className="pane">
      <div className="pane-h">
        <h2>{version}<span className="it">{replaying ? '(重播 v1 剪辑过程)' : version === 'v2' ? '(只重渲了 2 段 · 自检 9.0)' : '(首版 · 自检 8.8)'}</span></h2>
        <div className="ctrls">
          <VersionSeg version={version} setVersion={setVersion} notify={notify} />
          <button className="sw" onClick={() => setCompare(c => !c)} aria-pressed={compare}>对比
            <span className={'tr2' + (compare ? ' on' : '')}><motion.span layout className="kn" transition={SPRING} /></span>
          </button>
          <Tap className="btn btn-k" onClick={() => setExportOpen(o => !o)} aria-expanded={exportOpen}>{Ico.down}导出</Tap>
        </div>
        <AnimatePresence>{exportOpen && (
          <motion.div className="menu" initial={{ opacity:0, y:-6, scale:.98 }} animate={{ opacity:1, y:0, scale:1 }} exit={{ opacity:0, y:-4 }} transition={SPRING} style={{ transformOrigin:'top right' }}>
            <div className="mh">导出 {version}</div>
            <button onClick={() => onExportPick('成片 MP4 1080×1920')}>成片 MP4<span className="it">1080×1920</span></button>
            <button onClick={() => onExportPick('封面 4:3')}>封面<span className="it">4:3</span></button>
            <button onClick={() => onExportPick('封面 3:4')}>封面<span className="it">3:4</span></button>
          </motion.div>
        )}</AnimatePresence>
      </div>
      <div className="frame">
        <LayoutGroup>
          <div className="stagewin" style={compare ? {} : { paddingLeft:120 }}>
            <AnimatePresence mode="popLayout" initial={false}>
              {(compare ? ['v1', 'v2'] : [version]).map(v => (
                <Player key={compare ? v : 'single'} ver={v} seg={seg} t={t} h={compare ? 520 : 560} playing={playing} setPlaying={setPlaying}
                  onSeek={onSeek} onShot={onShot} replaying={replaying} compare={compare} />
              ))}
            </AnimatePresence>
          </div>
        </LayoutGroup>
        <AnimatePresence>{!compare && (
          <motion.div className="tw" style={{ left:36, bottom:150 }} initial={{ opacity:0, y:24, scale:.96 }} animate={{ opacity:1, y:0, scale:1 }} exit={{ opacity:0, y:16, scale:.96 }} transition={SOFT}>
            <div className="titlebar"><Lights /><span className="tt">Terminal — v3 — 100×30</span></div>
            <div className="tw-body">
              <div><span className="p">$ </span>mingzhi bg 夜景落地窗 --keep 分镜 字幕</div>
              <div className="d">  RVM 抠像 · 18 段 · 只重渲人像层</div>
              <div><span className="y">{SPIN[Math.floor(Date.now() / 90) % 10]}</span> 合成中 <span className="tw-bar"><i /></span>62%</div>
              <div className="d">  ⎿ 预计 +¥0.21 · 完成后出 v3</div>
            </div>
          </motion.div>
        )}</AnimatePresence>
        <AnimatePresence>{compare && (
          <motion.div className="diff" initial={{ opacity:0, y:10, x:'-50%' }} animate={{ opacity:1, y:0, x:'-50%' }} exit={{ opacity:0, y:8, x:'-50%' }} transition={SOFT}>
            同步播放 · 只有 2 段不同
            {SEGS.filter(s => s.chg).map(s => <span key={s.s} className="hl" onClick={() => onSeek(s.s + .01)}>@{fmt(s.s)} {s.card}</span>)}
            <span className="it" style={{ fontSize:15, color:'var(--text-3)', paddingRight:8 }}>(自检 8.8 → 9.0)</span>
          </motion.div>
        )}</AnimatePresence>
      </div>
    </section>
  );
}

/* ================= App ================= */
function App() {
  const [version, setVersion] = useState('v2');
  const [compare, setCompare] = useState(false);
  const [t, setT] = useState(58.4);
  const [playing, setPlaying] = useState(false);
  const [rt, setRt] = useState(null);
  const [choice, setChoice] = useState(1);
  const [tags, setTags] = useState([]);
  const [draft, setDraft] = useState('');
  const [extra, setExtra] = useState([]);
  const [flyer, setFlyer] = useState(null);
  const [exportOpen, setExportOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [, tick] = useState(0);
  const streamRef = useRef(null), tagRef = useRef(null);
  const st = useRef({}); st.current = { playing, rt };

  // 单一 rAF 时钟：播放 + 重播
  useEffect(() => {
    if (!playing && rt === null) return;
    let id, last = performance.now();
    const loop = now => {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (st.current.playing) setT(x => (x + dt) % TOTAL);
      if (st.current.rt !== null) setRt(r => r === null ? null : Math.min(REPLAY_END, r + dt));
      id = requestAnimationFrame(loop);
    };
    id = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(id);
  }, [playing, rt === null]);
  useEffect(() => { if (rt !== null && rt >= REPLAY_END) { const id = setTimeout(() => setRt(null), 500); return () => clearTimeout(id); } }, [rt]);
  // 终端转圈符
  useEffect(() => { const id = setInterval(() => tick(x => x + 1), 120); return () => clearInterval(id); }, []);

  useLayoutEffect(() => { const s = streamRef.current; s.scrollTop = s.scrollHeight; }, []);
  useEffect(() => { document.fonts.ready.then(() => { const s = streamRef.current; if (!window.__keepScroll) s.scrollTop = s.scrollHeight; }); }, []);
  useEffect(() => {
    if (!extra.length) return;
    const s = streamRef.current; s.scrollTo({ top: s.scrollHeight, behavior:'smooth' });
    const id = setTimeout(() => s.scrollTo({ top: s.scrollHeight, behavior:'smooth' }), 450);
    return () => clearTimeout(id);
  }, [extra.length]);

  const notify = msg => { setToast(msg); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToast(null), 2200); };
  const replay = () => {
    setRt(0); setPlaying(false);
    const s = streamRef.current, el = document.getElementById('live');
    // 原生 smooth scroll 会被终端内部的 scrollTop 更新打断，改用 motion 的 animate 逐帧驱动
    if (s && el) { const to = s.scrollTop + el.getBoundingClientRect().top - s.getBoundingClientRect().top - 14; animate(s.scrollTop, to, { type:'spring', stiffness:170, damping:28, onUpdate: v => { s.scrollTop = v; } }); }
  };

  // 重播分镜阶段：预览跟着跑
  const filled = rt === null ? 18 : Math.floor(clamp((rt - ST[3]) / (ST[4] - ST[3] - .1)) * 18);
  const viewSeg = rt !== null && rt >= ST[3] ? Math.min(17, Math.max(0, filled - 1)) : segAt(t);
  const viewT = rt !== null && rt >= ST[3] ? SEGS[viewSeg].s : t;

  const onShot = (e, g) => {
    if (rt !== null) return;
    setPlaying(false);
    const tag = { time: fmt(g.s), card: g.card, label: fmt(g.s) + g.card };
    if (tags.some(x => x.label === tag.label)) return;
    const to = tagRef.current.getBoundingClientRect();
    setFlyer({ ...tag, x: e.clientX - 50, y: e.clientY - 12, tx: to.left + 8 + tags.length * 130, ty: to.top + 4 });
  };
  const land = () => { setTags(ts => [...ts, flyer]); setFlyer(null); };
  const send = () => {
    const text = draft.trim();
    if (!text && !tags.length) { notify('先说一句要改什么'); return; }
    setExtra(x => [...x, { io:'in', text, tags }]);
    setDraft(''); setTags([]);
    setTimeout(() => setExtra(x => [...x, { io:'out', text:`收到${text ? '「' + text + '」' : ''}。v3 正在换背景，合成完成后接着改这一处，预估 +¥0.12。` }]), 700);
  };
  const onChip = c => { if (c === '导出') { setExportOpen(true); return; } setDraft(c); };
  const onExportPick = what => { setExportOpen(false); notify(`${version} · ${what} 已加入导出队列`); };

  return (
    <MotionConfig reducedMotion="user">
      <div className="app">
        <TopBar />
        <div className="main">
          <Rail />
          <Chat rt={rt} onReplay={replay} version={version} setVersion={setVersion} choice={choice} setChoice={setChoice} extra={extra}
            onExport={() => setExportOpen(true)} streamRef={streamRef}
            composer={<Composer tags={tags} setTags={setTags} draft={draft} setDraft={setDraft} onSend={send} onChip={onChip} tagRef={tagRef} />} />
          <Pane version={version} setVersion={setVersion} compare={compare} setCompare={setCompare} t={viewT} seg={viewSeg}
            playing={playing} setPlaying={setPlaying} onSeek={s => setT(clamp(s, 0, TOTAL - .01))} onShot={onShot}
            exportOpen={exportOpen} setExportOpen={setExportOpen} onExportPick={onExportPick} rt={rt} notify={notify} />
        </div>
      </div>
      {flyer && (
        <motion.span className="hl flyer" initial={{ x: flyer.x, y: flyer.y, scale:1.25 }} animate={{ x: flyer.tx, y: flyer.ty, scale:1 }}
          transition={{ type:'spring', stiffness:170, damping:21 }} onAnimationComplete={land}>@{flyer.time} {flyer.card}</motion.span>
      )}
      <AnimatePresence>{toast && (
        <motion.div className="toast" initial={{ opacity:0, y:12, x:'-50%' }} animate={{ opacity:1, y:0, x:'-50%' }} exit={{ opacity:0, y:8, x:'-50%' }} transition={SPRING}>{toast}</motion.div>
      )}</AnimatePresence>
    </MotionConfig>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
