<title>明知 · ego 暗色</title>
<!--
============================================================================
 G2 · ego 暗色 —— 明知AI剪辑 第四轮初稿
============================================================================
 form 来自内容的哪里：
   看片要准，所以全暗。舞台就是一间小影院（03-cinema 油画压暗），9:16 成片作为一扇
   深色浮窗立在画中银幕的位置，旁边叠一扇终端窗，写着这一帧是哪一段、用了什么卡、
   改没改过。AI 在干活时，背景点阵里的点会从干活的地方被蓝色点亮、一圈圈扩散出去
   （显影中的 v3、重播剪辑过程、你刚发出的指令），没在干活时点阵就是安静的灰点。

 ego 设计 DNA 对照表（token 来自 lite.ego.app 线上 CSS 实测，2026-10-14）：
   字体     标题 system-ui 700 / 行高 1.0；点缀词 IBM Plex Serif Italic 200（线上 computed
            style 实测：「browser」「(lite)」「(yes, free)」都是 ibmPlexSerif 200 italic）；
            代码/时间码 IBM Plex Mono（ego 也加载了这个字体）
   背景     html.dark：--bg-1 #2e2e2e / --bg-2 #292929 / --bg-3 #242424 / --bg-4 #141414 / --bg-5 #0d0d0d
   文字     html.dark：--text-1 #ffffffe6 / --text-2 #ffffffb3 / --text-3 #ffffff7a / --text-4 #ffffff3d
            （text-3 只放在 bg-3 及更暗的底上，对比度 ≥4.68；bg-1 上的辅助文字改用 text-2）
   蓝阶     --brand-1..6 #d6dff5 → #294ea3；html.dark --accent #7d9aeb、--accent-light #303848；
            全页唯一的彩色（关键短语胶囊、@引用、选中态、进度、点阵点亮）
   点阵     --dot-grid-base 换成暗色版（白 7%）；--dot-grid-active #004cfe80 在暗底上太沉，
            点亮时提到 accent #7d9aeb，并按 --dot-grid-active 的思路做半透明扩散
   发光边   --glow-border #adc0eb：选中的版式、选中的背景、显影中的卡片
   渐变     --positive-ripple：显影进度条、自检分数条
   阴影     --shadow-1 0 0 0 1px #ffffff0f；--shadow-3 0 0 0 1px #ffffff14, 0 16px 48px #00000059；
            浮窗 0 25px 50px -12px rgba(0,0,0,.6)
   圆角     6 / 10 / 13 / 18 / 26，按钮全部胶囊
   构图     ego hero 的「油画 + 白色浮窗 + 深色终端窗叠放」→ 暗版：压暗油画画框 + 深色预览浮窗 + 更深的终端窗
   按钮     主 CTA：ego 浅色版是黑底白字胶囊，暗色版翻转成白底黑字胶囊；次 CTA 用 #ffffff14 胶囊；
            旁边配斜体衬线小注「(只花 ¥3.84)」
   公告条   ego 顶部 brand-1 公告条 → 暗色 accent-light #303848，内容是正在显影的 v3，配黑色小胶囊
   Space    ego 把工作区叫 Space、带缩略图 → 左侧项目栏每期是一个 Space，用油画做缩略图
   窗口点   ego 的红黄绿三点在本版改成中性灰，遵守「蓝阶是唯一彩色」

 参考清单（v3 的 10 个资源在本会话里已经实际打开过，结论沿用；加上 ego 本站）：
  0. lite.ego.app（Playwright 渲染 + 读 CSSOM）：上面的整张对照表。
  1. motion.dev/docs/react-scroll-animations：对话流消息用 whileInView + viewport.root 进入；
     头部的蓝色细导引条用 useScroll(container) + useSpring。
  2. prompt-motion.com：403，加上 Cloudflare 人机验证，没看到内容，没有借鉴。
  3. unsection.com：Cloudflare 人机验证，没看到内容，没有借鉴。
  4. bentogrids.com：设置卡展开后是 2×2 便当格（素材 / 背景 / 字幕 / 预估）。
  5. 60fps.design：Spring / Glow / Stagger / Typing → @标签弹簧飞入、选中态 glow、
     重播逐行 stagger、处理中消息逐字流出。
  6. jiro.build：模板库，没有可直接用的风格词；只借了它「风格写成关键词」的写法，
     这里换成上面的 DNA 对照表。
  7. navbar.gallery：Side Bar Menu → 60px Space 栏；Announcement Bar → 顶部 v3 公告条。
  8. footer.design：Trove 的 Small Type 收尾 → 输入框下一行小字（MIT · 本机识别 · 音频不出本机）。
  9. cta.gallery：Download 类 CTA → 导出按钮配斜体小注，菜单每项写明规格。
 10. styles.refero.design：ego 本身就是用户指定的风格，refero 只拿来对照 Linear 的「midnight precision」，
     刻意避开它的冷蓝黑底和霓虹：底色用 ego 的中性灰阶，不偏蓝。
============================================================================
-->

<style>
html.dark{
  --bg-1:#2e2e2e; --bg-2:#292929; --bg-3:#242424; --bg-4:#141414; --bg-5:#0d0d0d; --bg-6:#000;
  --bg-alpha-2:#ffffff0a; --bg-alpha-3:#ffffff0f; --bg-alpha-4:#ffffff14; --bg-alpha-5:#ffffff1a; --bg-alpha-6:#ffffff1f;
  --text-0:#fff; --text-1:#ffffffe6; --text-2:#ffffffb3; --text-3:#ffffff7a; --text-4:#ffffff3d; --text-5:#ffffff29;
  --brand-1:#d6dff5; --brand-2:#adc0eb; --brand-3:#85a0e0; --brand-4:#5c81d6; --brand-5:#3361cc; --brand-6:#294ea3;
  --accent:#7d9aeb; --accent-light:#303848; --accent-dark:#2e57b8;
  --glow-border:#adc0eb;
  --positive-ripple:linear-gradient(90deg,#f0f3fa 0%,#e3e9f7 16.72%,#b7c7eb 31.81%,#b7c6eb 46.23%,#7d9add 62.06%,#8da6e1 74.49%,#708fda 87.22%,#97aee3 100%);
  --shadow-1:0 0 0 1px #ffffff0f; --shadow-1-1:0 0 0 1px #ffffff1a;
  --shadow-3:0 0 0 1px #ffffff14, 0 16px 48px 0 #00000059;
  --float:0 0 0 1px #ffffff14, 0 25px 50px -12px rgba(0,0,0,.6);
  --r-6:6px; --r-10:10px; --r-13:13px; --r-18:18px; --r-26:26px;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --serif-i:'IBM Plex Serif',ui-serif,Georgia,'Songti SC',serif;
  --mono:'IBM Plex Mono',ui-monospace,'PingFang SC',monospace;
  --frame-sans:'Noto Sans SC','PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-5);color:var(--text-1);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{font:inherit;color:inherit}
img{display:block}
::selection{background:var(--accent-dark);color:#fff}
/* ego 的斜体衬线点缀词 */
.i{font-family:var(--serif-i);font-style:italic;font-weight:200;letter-spacing:0}
.mono{font-family:var(--mono)}
/* 关键短语高亮：浅蓝胶囊 → 暗版 accent-light 底 + brand-2 字 */
.hl{background:var(--accent-light);color:var(--brand-2);font-weight:600;padding:1px 7px;border-radius:7px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

#dots{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:grid;grid-template-columns:60px 552px 1fr;grid-template-rows:34px 1fr;height:100vh;width:100vw}

/* 公告条 */
.bar{grid-column:1/-1;background:var(--accent-light);display:flex;align-items:center;justify-content:center;gap:12px;font-size:13.5px;color:var(--text-1);position:relative;z-index:5}
.bar .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.bar b{font-weight:600;color:var(--brand-2)}
.pill-black{height:24px;padding:0 10px 0 12px;border-radius:999px;background:#000;color:#fff;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.pill-black:hover{background:#111}

/* Space 栏 */
.rail{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 12px;border-right:1px solid var(--bg-alpha-3);background:#0d0d0dd9;position:relative;z-index:6}
.mark{width:34px;height:34px;border-radius:10px;background:var(--text-1);color:#000;display:grid;place-items:center;font-weight:700;font-size:16px}
.rail hr{width:24px;border:0;height:1px;background:var(--bg-alpha-5)}
.space{display:flex;flex-direction:column;align-items:center;gap:5px}
.space .th{width:40px;height:40px;border-radius:10px;overflow:hidden;box-shadow:var(--shadow-1);transition:box-shadow .2s}
.space .th img{width:100%;height:100%;object-fit:cover}
.space.on .th{box-shadow:0 0 0 2px var(--bg-5),0 0 0 3.5px var(--glow-border)}
.space .lb{font-size:12px;color:var(--text-3);line-height:1}
.space.on .lb{color:var(--text-1)}
.add{width:40px;height:40px;border-radius:10px;background:var(--bg-alpha-4);color:var(--text-2);font-size:20px;display:grid;place-items:center}
.add:hover{background:var(--bg-alpha-6);color:var(--text-1)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{background:var(--bg-alpha-4);color:var(--text-1)}
.menu-wrap{position:relative}
.menu{position:absolute;z-index:60;min-width:250px;background:var(--bg-1);border-radius:var(--r-13);box-shadow:var(--float);padding:6px}
.menu.side{left:calc(100% + 10px);bottom:0;min-width:330px}
.menu.down{right:0;top:calc(100% + 8px)}
.menu.down-l{left:0;top:calc(100% + 8px)}
.mh{padding:7px 10px 5px;font-size:12px;color:var(--text-2)}
.mi{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 10px;border-radius:8px;font-size:14px;text-align:left;color:var(--text-1)}
.mi:hover{background:var(--bg-alpha-4)}
.mi .mono{font-size:12px;color:var(--text-2)}

/* 对话列 */
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bg-alpha-3)}
.hd{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;position:relative;background:var(--bg-5)}
.word{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--text-1);white-space:nowrap}
.word .i{font-size:19px;color:var(--text-2);margin-left:3px}
.bal{margin-left:auto;font-size:13px;color:var(--text-3);white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.bal b{font-size:15px;color:var(--text-1);font-weight:600;font-variant-numeric:tabular-nums}
.bal .i{font-size:14px;color:var(--text-2)}
.leader{position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--accent);transform-origin:0 50%;opacity:.8}
.leader-bg{position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--bg-alpha-4)}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 24px 16px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.who .av{width:20px;height:20px;border-radius:6px;background:var(--text-1);color:#000;font-size:11px;font-weight:700;display:grid;place-items:center}
.who .t{margin-left:auto;font-family:var(--mono);font-size:12px}
.ai-text{font-size:15px;line-height:1.7;color:var(--text-1);text-wrap:pretty}
.card{background:var(--bg-3);border-radius:var(--r-18);box-shadow:var(--shadow-1);padding:14px 16px}
.k{font-size:12px;color:var(--text-3)}

/* 设置卡 */
.setup-row{display:flex;align-items:center;gap:12px}
.setup-row .th{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none}
.setup-row .th img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.setup-row .nm{font-weight:600;font-size:15px;line-height:1.3}
.setup-row .sub{font-size:13px;color:var(--text-3)}
.chev{margin-left:auto;width:32px;height:32px;border-radius:999px;background:var(--bg-alpha-4);display:grid;place-items:center;color:var(--text-2);flex:none}
.chev:hover{color:var(--text-1);background:var(--bg-alpha-6)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cell{background:var(--bg-1);border-radius:var(--r-13);padding:12px;min-width:0}
.cell .k{color:var(--text-2)}
.cell .v{font-size:15px;font-weight:600;margin-top:2px}
.cell .img{height:70px;border-radius:8px;overflow:hidden;margin-top:8px}
.cell .img img{width:100%;height:100%;object-fit:cover}
.subprev{margin:10px 0 2px;font-family:var(--frame-sans);font-weight:900;font-size:19px;line-height:1.2;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;white-space:nowrap}
.subprev span{color:#D4FF3A}
.cost{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.cost .i{font-size:17px;color:var(--text-2);font-weight:200;margin-left:6px}
.rip{height:4px;border-radius:4px;background:var(--bg-alpha-5);overflow:hidden;margin-top:10px}
.rip i{display:block;height:100%;background:var(--positive-ripple);border-radius:4px}
.cta-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.btn-w{height:40px;padding:0 18px;border-radius:999px;background:var(--text-1);color:#000;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-w:hover{background:#fff}
.btn-w[disabled]{background:var(--bg-alpha-6);color:var(--text-2);cursor:default}
.btn-g{height:34px;padding:0 14px;border-radius:999px;background:var(--bg-alpha-4);color:var(--text-1);font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-g:hover{background:var(--bg-alpha-6)}
.btn-g[disabled]{color:var(--text-3);cursor:default;background:var(--bg-alpha-3)}
.note{font-family:var(--serif-i);font-style:italic;font-weight:200;font-size:17px;color:var(--text-2);white-space:nowrap}

/* 终端窗（剪辑直播） */
.term{background:var(--bg-5);border-radius:var(--r-13);box-shadow:var(--shadow-3);overflow:hidden;position:relative}
.tbar{height:34px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--bg-alpha-3);position:relative}
.tbar i{width:10px;height:10px;border-radius:50%;background:var(--text-5)}
.tbar .ttl{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text-3);pointer-events:none}
.tbody{padding:12px 14px 14px;font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--text-2)}
.tbody .ok{color:var(--accent)}
.tbody .w{color:var(--text-1)}
.tbody .dim{color:var(--text-3)}
.trow{display:grid;grid-template-columns:18px 64px 1fr;gap:0 6px;align-items:baseline}
.strip8{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0 4px}
.strip8 .c{aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--bg-3)}
.strip8 img{width:100%;height:100%;object-fit:cover}
.tfoot{display:flex;align-items:center;gap:12px;padding:0 14px 14px}
/* 重播 */
.ln{display:flex;flex-wrap:wrap;align-items:baseline;font-family:var(--sans);font-size:14.5px;line-height:1.65;color:var(--text-1)}
.ln .n{font-family:var(--mono);font-size:12px;color:var(--text-3);width:46px;flex:none}
.tok{display:inline-block;white-space:pre;position:relative}
.cut{border-radius:5px;padding:0 3px;margin:0 1px}
.cut .st{position:absolute;left:2px;right:2px;top:54%;height:1.5px;background:var(--accent);transform-origin:0 50%}
.scraps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;min-height:28px}
.scrap{height:24px;padding:0 9px;border-radius:999px;background:var(--bg-alpha-4);font-family:var(--sans);font-size:12.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.scrap s{text-decoration-color:var(--accent);text-decoration-thickness:1.5px}
.scrap .kd{color:var(--brand-2);font-size:12px}
.cnt{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--text-3)}
.cnt b{color:var(--text-1);font-weight:500;font-variant-numeric:tabular-nums}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.score .k{font-family:var(--sans)}
.score .v{font-family:var(--sans);font-size:22px;font-weight:700;color:var(--text-1);line-height:1.2;font-variant-numeric:tabular-nums}
.final{margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--accent-light);font-family:var(--sans);font-size:14px;color:var(--text-1)}
.final b{color:var(--brand-2);font-weight:600}

/* 版本卡 */
.ver{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ver .ths{display:flex;gap:4px}
.ver .ths .c{width:34px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--bg-1)}
.ver .ths img{width:100%;height:100%;object-fit:cover}
.ver h3{font-size:17px;font-weight:700;line-height:1.2;display:flex;align-items:baseline;gap:6px}
.ver h3 .i{font-size:18px;color:var(--text-2)}
.ver h3 .now{margin-left:auto;font-size:12px;font-weight:500;color:var(--brand-2);font-family:var(--sans)}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13px;color:var(--text-3);margin:4px 0 10px}
.meta b{color:var(--text-1);font-weight:600;font-size:15px;margin-right:3px;font-variant-numeric:tabular-nums}
.meta .up b{color:var(--brand-2)}
.acts{display:flex;gap:8px;align-items:center}

/* 用户消息 */
.me{align-self:flex-end;max-width:410px}
.bub{background:var(--accent-light);border-radius:18px 18px 6px 18px;padding:10px 14px;font-size:15px;line-height:1.65;color:var(--text-1)}
.ref{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--brand-6);color:var(--brand-1);font-family:var(--mono);font-size:12.5px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.me .t{text-align:right;font-family:var(--mono);font-size:12px;color:var(--text-3);margin-top:5px}

/* AI 回复：引用 + 版式选项 */
.refs{display:flex;gap:8px;margin-top:12px}
.refc{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:12px;background:var(--bg-3);box-shadow:var(--shadow-1)}
.refc .fr{border-radius:6px;overflow:hidden}
.refc .k{font-family:var(--mono);color:var(--brand-2)}
.refc .n{font-size:13px;color:var(--text-1)}
.opts-k{margin:16px 0 8px;font-size:13px;color:var(--text-2)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:var(--bg-3);border-radius:var(--r-13);box-shadow:var(--shadow-1);padding:8px;text-align:left;position:relative}
.opt:hover{box-shadow:var(--shadow-1-1)}
.opt .lay{height:74px;border-radius:8px;background:#efefef;padding:9px;overflow:hidden;position:relative}
.opt .lb{display:flex;gap:6px;align-items:baseline;font-size:13px;margin:8px 2px 2px;color:var(--text-1)}
.opt .lb .mono{font-size:12px;color:var(--text-3)}
.opt .ring{position:absolute;inset:-1px;border-radius:14px;box-shadow:0 0 0 2px var(--glow-border),0 0 24px 2px #7d9aeb40;pointer-events:none}
.opt .chk{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--brand-5);color:#fff;display:grid;place-items:center}

<script>
(function () {
  const cv = document.getElementById('dots'), ctx = cv.getContext('2d');
  const GAP = 18, LIFE = 2.8, SPEED = 360, BAND = 70;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, ripples = [], mouse = null, running = false;
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); kick();
  }
  function draw(now) {
    const t = now / 1000;
    ripples = ripples.filter(r => t - r.t0 < LIFE);
    ctx.clearRect(0, 0, W, H);
    for (let y = GAP / 2; y < H; y += GAP) {
      for (let x = GAP / 2; x < W; x += GAP) {
        let I = 0;
        for (const r of ripples) {
          const age = t - r.t0, d = Math.hypot(x - r.x, y - r.y), front = age * SPEED;
          const k = (d - front) / BAND;
          const v = Math.exp(-k * k) * (1 - age / LIFE) * r.s;
          if (v > I) I = v;
        }
        if (mouse) { const d = Math.hypot(x - mouse.x, y - mouse.y); if (d < 90) I = Math.max(I, (1 - d / 90) * 0.35); }
        if (I > 0.03) {
          ctx.fillStyle = `rgba(125,154,235,${(0.18 + 0.78 * I).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(x, y, 1 + 1.1 * I, 0, 6.283); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.075)';
          ctx.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
        }
      }
    }
    if (ripples.length || mouse) requestAnimationFrame(draw); else running = false;
  }
  function kick() { if (!running) { running = true; requestAnimationFrame(draw); } }

  window.__ripple = (x, y, s = 1) => { if (reduce) return; ripples.push({ x, y, s, t0: performance.now() / 1000 }); kick(); };

})();

const SCRIPT = [

  ['叫《高性价比人生指南》'],

  ['并且它每一条知识都是有证据来源的', { c: '，有证据来源的', k: '重复' }],
  ['然后我就很好奇地让 AI 帮我把它读了一遍'],
  ['第一点呢，它就建议我', { c: '少喝，', k: '口误' }, '少喝饮料'],
];
const LINE_SEG = [3, 4, 5, 7, 8, 9, 10];
const PRINT_SEG = [0, 4, 7, 8, 11, 13, 15, 17];
const SCORES = [['版式', 9.1], ['层级', 8.8], ['动效节奏', 8.6], ['品牌一致性', 9.3]];
const LINE_AT = i => 300 + i * 560;
const T_THUMBS = 5300, T_SCORES = 7700, T_FINAL = 9500, T_END = 10400;

function Live({ onCue, onLog }) {
  const [mode, setMode] = useState('sum');
  const [t, setT] = useState(0);
  const timer = useRef(null), boxRef = useRef(null), lastRip = useRef(0);
  const start = () => {
    clearInterval(timer.current);
    const box = boxRef.current, sc = box && box.closest('.scroll');
    if (sc) sc.scrollTo({ top: sc.scrollTop + box.getBoundingClientRect().top - sc.getBoundingClientRect().top - 12, behavior: 'smooth' });
    setMode('live'); setT(0);
    const t0 = performance.now();
    timer.current = setInterval(() => { const e = performance.now() - t0; setT(e); if (e > T_END) { clearInterval(timer.current); onLog && onLog(null); } }, 60);
  };
  useEffect(() => () => clearInterval(timer.current), []);
  const live = mode === 'live', running = live && t <= T_END;
  // AI 在干活：每 0.9 秒从终端窗点亮一圈点阵
  useEffect(() => { if (running && t - lastRip.current > 900) { lastRip.current = t; rippleAt(boxRef.current, 1); } if (!running) lastRip.current = -1e9; }, [t, running]);
  let cue = null;
  if (live && t < T_THUMBS) SCRIPT.forEach((_, i) => { if (t >= LINE_AT(i)) cue = LINE_SEG[i]; });
  if (live && t >= T_THUMBS && t < T_SCORES) cue = PRINT_SEG[Math.min(7, Math.floor((t - T_THUMBS) / 280))];
  useEffect(() => { if (cue !== null) onCue(SEGS[cue].t); }, [cue]);
  // 舞台终端窗同步打印剪辑日志
  const logs = [];
  if (running) {
    SCRIPT.forEach((line, i) => line.forEach(tk => { if (typeof tk !== 'string' && t > LINE_AT(i) + 1500) logs.push(`cut  @${fmt(SEGS[LINE_SEG[i]].t)}  「${tk.c.replace(/^，|，$/g, '')}」 ${tk.k}`); }));
    if (t >= T_THUMBS) logs.push(`storyboard  ${Math.min(8, Math.floor((t - T_THUMBS) / 280) + 1)}/8 张`);
    if (t >= T_SCORES) logs.push('self-check  版式 9.1 · 层级 8.8 …');
  }
  const logKey = logs.join('|');
  useEffect(() => { if (running) onLog(logs.slice(-5)); }, [logKey, running]);
  const clamp = x => Math.max(0, Math.min(1, x));
  const cutsP = clamp((t - 600) / (LINE_AT(6) + 1500 - 600));
  const scraps = [];
  if (live) SCRIPT.forEach((line, i) => line.forEach((tk, j) => { if (typeof tk !== 'string' && t > LINE_AT(i) + 1500) scraps.push({ id: i + '-' + j, c: tk.c.replace(/^，|，$/g, ''), k: tk.k }); }));
  return (
    <motion.div layout className="term" ref={boxRef} transition={{ duration: .45, ease: EASE }}>
      <div className="tbar"><i /><i /><i /><span className="ttl">剪辑直播 — {running ? '正在剪…' : '3:42 → 1:57'}</span></div>
      <AnimatePresence mode="wait" initial={false}>
        {!live ? (
          <motion.div key="sum" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .25 }}>
            <div className="tbody">
              <div className="trow"><span className="ok">✓</span><span className="w">识别</span><span>本机 Paraformer · 字级时间戳</span></div>
              <div className="trow"><span className="ok">✓</span><span className="w">剪口误</span><span>删除 <span className="w">37</span> 处气口 · <span className="w">12</span> 处口误</span></div>
              <div className="trow"><span className="ok">✓</span><span className="w">分镜</span><span><span className="w">18</span> 段 · 3:42 → <span className="w">1:57</span></span></div>
              <div className="trow"><span className="ok">✓</span><span className="w">自检</span><span>版式 <span className="w">9.1</span> · 层级 <span className="w">8.8</span> · 动效节奏 <span className="w">8.6</span> · 品牌一致性 <span className="w">9.3</span></span></div>
              <div className="strip8">{REAL.map(f => <div className="c" key={f}><img src={`assets/${f}.jpg`} alt="" /></div>)}</div>
            </div>
            <div className="tfoot">
              <motion.button className="btn-g" onClick={start} whileTap={{ scale: .96 }}>{Ico.play} 重播剪辑过程</motion.button>
              <span className="note" style={{ fontSize: 15 }}>(约 10 秒)</span>
            </div>
          </motion.div>
        ) : (
          <motion.div key="live" className="tbody" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .25 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6, minHeight: 214 }}>
              {SCRIPT.map((line, i) => {
                const at = LINE_AT(i); if (t < at) return null;
                return (
                  <motion.div key={i} className="ln" initial={{ opacity: 0, filter: 'blur(6px)', y: 4 }} animate={{ opacity: 1, filter: 'blur(0px)', y: 0 }} transition={{ duration: .7, ease: EASE }}>
                    <span className="n">{fmt(SEGS[LINE_SEG[i]].t)}</span>
                    <AnimatePresence initial={false}>
                      {line.map((tk, j) => {
                        if (typeof tk === 'string') return <span key={j} className="tok">{tk}</span>;
                        const marked = t > at + 350, struck = t > at + 800, gone = t > at + 1500;
                        if (gone) return null;
                        return (
                          <motion.span key={j} className="tok cut" animate={{ backgroundColor: marked ? '#303848' : 'rgba(48,56,72,0)', color: struck ? 'rgba(255,255,255,.48)' : marked ? '#adc0eb' : 'rgba(255,255,255,.9)' }}
                            exit={{ opacity: 0, width: 0, paddingLeft: 0, paddingRight: 0, marginLeft: 0, marginRight: 0, y: 10 }} transition={{ duration: .45, ease: EASE }}>
                            {tk.c}<motion.span className="st" initial={{ scaleX: 0 }} animate={{ scaleX: struck ? 1 : 0 }} transition={{ duration: .3, ease: EASE }} />
                          </motion.span>
                        );
                      })}
                    </AnimatePresence>
                  </motion.div>
                );
              })}
            </div>
            <div className="scraps">
              <span className="k" style={{ fontFamily: 'var(--sans)' }}>剪掉的</span>
              <AnimatePresence>{scraps.map(s => (
                <motion.span key={s.id} layout className="scrap" initial={{ opacity: 0, y: -16, scale: .8 }} animate={{ opacity: 1, y: 0, scale: 1 }} transition={{ type: 'spring', stiffness: 380, damping: 22, delay: .2 }}><s>{s.c}</s><span className="kd">{s.k}</span></motion.span>
              ))}</AnimatePresence>
            </div>
            <div className="cnt" style={{ fontFamily: 'var(--sans)' }}>
              <span>气口 <b>{Math.round(37 * cutsP)}</b> / 37</span><span>口误 <b>{Math.round(12 * cutsP)}</b> / 12</span><span>时长 <b>{fmt(222 - 105 * cutsP)}</b></span>
            </div>
            {t >= T_THUMBS - 200 && (
              <div className="strip8">{REAL.map((f, i) => (
                <div className="c" key={f}>{t >= T_THUMBS + i * 280 && <motion.img src={`assets/${f}.jpg`} alt="" initial={{ opacity: 0, scale: 1.15, filter: 'blur(6px) grayscale(1)' }} animate={{ opacity: 1, scale: 1, filter: 'blur(0px) grayscale(0)' }} transition={{ duration: .9, ease: EASE }} />}</div>
              ))}</div>
            )}
            {t >= T_SCORES && (
              <div className="scores">{SCORES.map(([k, v], i) => {
                const p = clamp((t - T_SCORES - i * 300) / 650);
                return (<div className="score" key={k} style={{ opacity: p > 0 ? 1 : .25 }}><div className="k">{k}</div><div className="v">{(v * p).toFixed(1)}</div><div className="rip" style={{ marginTop: 4 }}><i style={{ width: `${v * 10 * p}%` }} /></div></div>);
              })}</div>
            )}
            <AnimatePresence>{t >= T_FINAL && (
              <motion.div className="final" initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: .45, ease: EASE }}>

            {t > T_END && (
              <div style={{ display: 'flex', gap: 8, marginTop: 12, fontFamily: 'var(--sans)' }}>

              </div>

    </motion.div>

}

  const togglePlay = p => {
    // 暂停也会把当前画面引用到输入框
    if (!p && playing) { const r = document.querySelector('.fr-wrap'); if (r) { const b = r.getBoundingClientRect(); addTag(b.left + b.width / 2, b.top + b.height / 2); } }
    setPlaying(p);
  };
  useEffect(() => {
    const k = e => {
      if (e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') setTime(t => SEGS[Math.min(17, segAt(t) + 1)].t);
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') setTime(t => SEGS[Math.max(0, segAt(t) - 1)].t);
      if (e.key === ' ') { e.preventDefault(); togglePlay(!playing); }
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  });
  const scrollEnd = () => requestAnimationFrame(() => { const el = chatRef.current; el && el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); });
  const onSend = ({ text, tags }) => {
    setExtra(x => [...x, { role: 'me', text, tags }]); scrollEnd();
    rippleAt(document.querySelector('.box'), 1);
    setTimeout(() => {
      setExtra(x => [...x, { role: 'ai', text: `收到。${tags.length ? tags.join('、') + ' ' : ''}「${text || '按引用的画面改'}」排在 v3 之后，只重渲涉及的段落，本轮约 ¥0.12。` }]);
      scrollEnd();
    }, 900);
  };
  const goProc = () => { const el = chatRef.current, p = document.querySelector('.proc'); if (el && p) el.scrollTo({ top: el.scrollTop + p.getBoundingClientRect().top - el.getBoundingClientRect().top - 40, behavior: 'smooth' }); rippleAt(p, 1); };
  useEffect(() => { window.__app = { setVer, setCompare, setTime, addTag }; });

  return (
    <div className="app">
      <div className="bar">
        <motion.span className="pulse" animate={{ opacity: [1, .3, 1] }} transition={{ duration: 1.6, repeat: Infinity }} />
        <span>v3 正在把<b>「夜景落地窗」</b>合成到人像 · 62%，好了会自动换到右侧</span>
        <motion.button className="pill-black" whileTap={{ scale: .95 }} onClick={goProc}>看进度 {Ico.ne}</motion.button>
      </div>
      <Rail toast={toast} />
      <Chat ver={ver} setVer={setVer} tags={tags} setTags={setTags} inputRef={inputRef} toast={toast} extra={extra} onSend={onSend} chatRef={chatRef}
        onCue={t => { setPlaying(false); setTime(t); }} onLog={setStageLog} />
      <Stage ver={ver} setVer={setVer} compare={compare} setCompare={setCompare} time={time} setTime={setTime} playing={playing} setPlaying={togglePlay} onPick={onPick} toast={toast} stageLog={stageLog} />
      <AnimatePresence>{fly && (
        <motion.div key={fly.k} className="fly" initial={{ x: fly.from.x, y: fly.from.y, scale: 1.2, opacity: 0 }} animate={{ x: fly.to.x, y: fly.to.y, scale: 1, opacity: 1 }} exit={{ opacity: 0 }}
          transition={{ type: 'spring', stiffness: 170, damping: 22, mass: .8 }}
          onAnimationComplete={() => { setTags(t => (t.includes(fly.label) ? t : [...t, fly.label])); setFly(null); inputRef.current && inputRef.current.focus(); rippleAt(inputRef.current, .6); }}>
          {fly.label}
        </motion.div>
      )}</AnimatePresence>
      <AnimatePresence>{toastMsg && (
        <motion.div className="toast" style={{ left: 'calc(612px + (100vw - 612px) / 2)', x: '-50%' }} initial={{ opacity: 0, y: 14 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 10 }} transition={SPRING}><i />{toastMsg}</motion.div>
      )}</AnimatePresence>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
window.__ready = true;
</script>
</body>
</html>
