<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Mingzhi Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@1,200;1,300&family=Press+Start+2P&display=block" rel="stylesheet">
<style>
@font-face{font-family:"FusionPixel";src:url(fonts/fusion-pixel-12px-proportional-zh_hans.otf.woff2) format("woff2");font-display:block}
:root{
  /* G1 产品 token */
  --w0:#fff; --w1:#f7f7f7; --w2:#f5f5f5; --w3:#eee; --w4:#e0e0e0;
  --t1:#000000e6; --t2:#000000b3; --t3:#0000008f;
  --b1:#d6dff5; --b2:#adc0eb; --b3:#85a0e0; --b4:#5c81d6; --b5:#3361cc; --b6:#294ea3;
  /* logo 电光蓝：只给英雄与关键强调 */
  --hero:#014DF9; --hero-d:#0035B8;
  /* 像素层 */
  --ink:#1b1206; --cut:#c8402a; --cut-l:#e2614a; --cut-d:#8e2414; --shade:#d8e1f7; --gold:#e9c77a;
  --px:'Press Start 2P', ui-monospace, monospace;
  --pz:'FusionPixel', 'PingFang SC', monospace;
  --serif:'IBM Plex Serif', Georgia, serif;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --zh:-apple-system, 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
body{font-family:var(--zh);color:var(--t1);-webkit-font-smoothing:antialiased}
#frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#hud{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:50}
.abs{position:absolute}
img.pix,canvas.pix{image-rendering:pixelated;display:block}
.pz{font-family:var(--pz);-webkit-font-smoothing:none;font-weight:400;letter-spacing:0}
.step{clip-path:polygon(0 12px,6px 12px,6px 6px,12px 6px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 6px,calc(100% - 6px) 6px,calc(100% - 6px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 6px) calc(100% - 12px),calc(100% - 6px) calc(100% - 6px),calc(100% - 12px) calc(100% - 6px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 6px),6px calc(100% - 6px),6px calc(100% - 12px),0 calc(100% - 12px))}
.step-s{clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}

/* HUD：照工作台顶栏浅蓝条 */
.hudbar{position:absolute;left:0;top:0;width:1920px;height:64px;background:var(--b1);display:flex;align-items:center;padding:0 40px}
.hudbar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,var(--b1) 0 12px,transparent 12px 24px)}
.hudbar .brand{display:flex;align-items:center;gap:12px;font:600 19px/1 var(--zh);margin-right:auto}
.hudbar .brand img{width:34px;height:34px;border-radius:8px}
.hudbar .brand small{font:300 italic 16px/1 var(--serif);color:var(--t2)}
.hudbar .it{display:flex;align-items:center;gap:12px;margin-left:40px}
.hudbar .k{font:13px/1 var(--px);color:var(--b6)}
.hudbar .k.zh{font:600 15px/1 var(--zh)}
.hudbar .v{font:18px/1 var(--px);color:var(--t1)}
.hudbar .v i{font-style:normal;color:var(--b5)}
.hudbar .pips{display:flex;gap:4px}
.hudbar .pips b{width:12px;height:18px;background:var(--b2);display:block}
.hudbar .pips b.on{background:var(--b5)}
.hudbar .flash{background:#fff;outline:3px solid var(--hero);outline-offset:6px;box-shadow:0 0 0 6px #fff}

/* 关卡牌 / 文件牌 */
.tag{position:absolute;font:14px/1 var(--px);color:#fff;background:var(--ink);padding:9px 12px 8px;z-index:20}
.tag span{font:500 15px/1 var(--zh);margin-left:10px}

/* 地面 */
.tile{position:absolute;width:60px;height:60px;background:#fff;box-shadow:inset 6px 6px 0 #fff,inset -6px -6px 0 var(--w4);outline:3px solid var(--ink);outline-offset:-3px;display:grid;place-items:center;font:36px/1 var(--pz);color:var(--ink);-webkit-font-smoothing:none}
.tile.raw{background:#c9ccd2;box-shadow:inset 6px 6px 0 #d8dade,inset -6px -6px 0 #a9adb5}
.tile.dim{background:#f1f1f1;color:#b9b9b9;box-shadow:inset -6px -6px 0 #e4e4e4;outline-color:#cfcfcf}
.tile.dim.raw{background:#b4b8bf;box-shadow:inset -6px -6px 0 #a7abb3;outline-color:#9ca0a8;color:transparent}
.tile.reuse{filter:saturate(.2) brightness(.96)}
.soil{position:absolute;height:120px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,repeating-linear-gradient(90deg,transparent 0 57px,#cfcfcf 57px 60px),repeating-linear-gradient(180deg,var(--w3) 0 27px,#d6d6d6 27px 30px)}
.soil.raw{background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,repeating-linear-gradient(90deg,transparent 0 57px,#9da1a8 57px 60px),repeating-linear-gradient(180deg,#b7bac0 0 27px,#a7abb2 27px 30px)}
.pit{position:absolute;width:60px;height:180px;background:var(--ink)}

/* 口误小怪：变红的字幕砖 */
.mon{position:absolute;height:54px;background:var(--cut);outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 6px 6px 0 var(--cut-l),inset -6px -6px 0 var(--cut-d);display:grid;place-items:center;font:36px/1 var(--pz);color:#fff;-webkit-font-smoothing:none}
.mon .eye{position:absolute;top:-12px;width:12px;height:12px;background:#fff;outline:3px solid var(--ink)}
.mon .eye::after{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;background:var(--ink)}
.mon .fang{position:absolute;bottom:-6px;width:6px;height:6px;background:var(--ink)}
.pop{position:absolute;font:16px/1 var(--px);color:#fff;background:var(--ink);padding:9px 12px 8px;z-index:30;white-space:nowrap}
.pop s{font:24px/1 var(--pz);text-decoration:none;position:relative;margin-left:10px;-webkit-font-smoothing:none}
.pop s::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:4px;background:var(--cut)}

.trail b{position:absolute;width:12px;height:12px;background:#fff;outline:3px solid var(--ink)}
.burst b{position:absolute;background:#fff;outline:3px solid var(--ink)}

/* 白色像素面板（标题对话框） */
.panel{position:absolute;background:#fff;z-index:20}
.panel-sh{position:absolute;background:var(--b6);z-index:19}
.kicker{display:flex;align-items:center;gap:14px;font:16px/1 var(--zh);color:var(--t2)}
.kicker .p{font:14px/1 var(--px);color:var(--b5)}
.big{font:96px/1.05 var(--pz);color:#141414;-webkit-font-smoothing:none}
.mid{font:72px/1.1 var(--pz);color:#141414;-webkit-font-smoothing:none}
.cap{background:var(--b1);color:var(--b6);font:200 italic 64px/1 var(--serif);padding:2px 20px 10px 14px}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--b1);color:var(--b6);font:600 20px/1 var(--zh);padding:10px 16px}
.chip em{font:300 italic 24px/1 var(--serif)}

/* 产品浮窗（真实截图裁切） */
.win{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.28),0 6px 16px rgba(0,0,0,.16)}
.win .shot{position:absolute;left:0;top:0;background-repeat:no-repeat}
.wbar{position:absolute;left:0;top:0;right:0;height:38px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:7px;font:13px/1 var(--zh);color:#707070}
.wbar i{width:12px;height:12px;border-radius:50%;display:block}
.wbar .t{flex:1;text-align:center;margin-right:40px}
.lock{position:absolute;width:30px;height:30px;border:6px solid var(--hero)}

/* 终端（产品剪辑直播里的 Terminal） */
.term{position:absolute;background:#1f1f22;border-radius:14px;box-shadow:0 24px 48px rgba(0,0,0,.3);color:#e8e8e8;font:15px/1.9 var(--mono);padding:0 0 14px}
.term .tb{height:34px;display:flex;align-items:center;gap:7px;padding:0 14px;color:#9a9a9a;font:13px/1 var(--mono)}
.term .tb i{width:11px;height:11px;border-radius:50%}
.term .tb span{margin-left:12px}
.term p{padding:0 18px;white-space:nowrap}
.term .ok{color:#7fd18b}.term .d{color:#8f8f8f}.term .hl{color:#9fb6ff}

/* RPG 对话框 */
.rpg{position:absolute;background:#fff;outline:6px solid var(--ink);outline-offset:-6px;z-index:30}
.rpg .who{position:absolute;left:30px;top:-27px;background:var(--ink);color:#fff;font:16px/1 var(--px);padding:10px 14px 9px}
.rpg .who span{font:600 17px/1 var(--zh);margin-left:8px}
.caret{display:inline-block;width:14px;height:52px;background:var(--hero);vertical-align:-8px;margin-left:4px}
.atchip{display:inline-flex;align-items:center;background:var(--b1);color:var(--b6);font:48px/1 var(--pz);padding:6px 12px 6px;margin-right:16px;-webkit-font-smoothing:none}

/* 信息卡（产品分镜卡 HTML 重建） */
.card{position:absolute;background:#fff;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:22px 24px;font:700 30px/1.25 var(--zh);color:#111}
.card small{display:block;margin-top:8px;font:400 17px/1.3 var(--zh);color:#777}

/* 结算格 */
.bento{position:absolute;display:grid;gap:18px}
.cell{background:#fff;position:relative;padding:28px 30px}
.cell h6{font:13px/1 var(--px);color:var(--b5);font-weight:400;margin-bottom:18px}
.cell .n{font:300 italic 76px/1 var(--serif);color:var(--t1);letter-spacing:-1px}
.cell .n em{font-style:italic;color:var(--b5)}
.cell .n s{text-decoration:none;color:var(--t3)}
.cell p{margin-top:14px;font:18px/1.4 var(--zh);color:var(--t2)}
</style>
</head>
<body>
<div id="frame"><div id="stage"></div><div id="hud"></div></div>
<script>
/* ───────── 基础工具 ───────── */
const Q=new URLSearchParams(location.search), K=Q.get('k')||'01';
const stage=document.getElementById('stage'), hud=document.getElementById('hud');
const INK='#1b1206';
function el(tag,cls,css,html,parent){const e=document.createElement(tag); if(cls)e.className=cls; if(css)e.style.cssText=css; if(html!=null)e.innerHTML=html; (parent||stage).appendChild(e); return e;}
function seeded(s){return ()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function img(src,css,parent,cls='pix'){const i=el('img',cls,css,null,parent);i.src=src;return i;}

/* ASCII 像素图 → canvas（自动 4 邻域描边 + 下沿阴影） */
function sprite(rows,pal,cell=6,{outline=true,shade=true}={}){
  rows=rows.map(r=>r.replace(/\s/g,''));
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)), P=outline?1:0;
  const W=w+2*P,H=h+2*P;
  const g=Array.from({length:H},()=>Array(W).fill(null));
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.')g[y+P][x+P]=ch;}));
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){
    const ch=g[yy][xx];
    if(ch){let col=pal[ch]; if(shade&&ch==='#'&&yy+1<H&&!g[yy+1][xx])col=pal.s||col; x.fillStyle=col; x.fillRect(xx,yy,1,1);}
    else if(outline){const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const a=g[yy+dy]&&g[yy+dy][xx+dx];return a&&a!=='o';}); if(n){x.fillStyle=pal.k||INK;x.fillRect(xx,yy,1,1);}}
  }
  c.className='pix'; c.style.width=W*cell+'px'; c.style.height=H*cell+'px'; return c;
}

/* ───────── 英雄：logo 小象像素化（24×22 格，来自 logo.svg 的 BOX 降采样后手修） ───────── */
const ELE_BASE=[
'................######..',
'.............##########.',
'..........##############',
'......#############ee###',
'...################ee###',
'.#######################',
'########################',
'########################',
'##############....######',
'##############.....#####',
'##############.....#####',
'#####.########.....#####',
'#####..#######.....#####',
'####...#######.....#####',
'####....######.....#####',
'####....######.....#####',
'###......####......#####',
'###......####......#####',
'###.......###......#####',
'##........###......#####',
'##.........##......#####',
'...................####.'];
function elePose(p){
  let r=ELE_BASE.slice();
  const set=(y,s)=>{r[y]=s;};
  if(p==='walk'){ // 摆腿帧：后腿抬一格、中腿前移、鼻尖后摆
    set(19,'.##.......###......#####'); set(20,'..##.......##......#####'); set(21,'..................####..');
  }
  if(p==='jump'){ // 腾空：腿收起、鼻子甩前
    r=r.slice(0,18); r.push('.##.......##.......#####'); r.push('...................######'); r.push('......................##');
  }
  if(p==='squash'){ // 落地压扁：去掉两行身体，鼻尖外甩
    r=r.filter((_,i)=>i!==6&&i!==13); r[r.length-1]='..................######';
  }
  if(p==='cheer'){ // 庆祝：腾空 + 眯眼（眼睛压成一条线），鼻尖上甩
    r=r.slice(0,18); r.push('.##.......##.......#####'); r.push('...................######'); r.push('.....................###');
    r[3]=r[3].replace('ee','##'); r[4]=r[4].replace('ee','ee');
    r[3]=r[3].slice(0,19)+'ee'+r[3].slice(21); r[4]=r[4].slice(0,19)+'##'+r[4].slice(21);
  }
  return r;
}
const ELE_PAL={'#':'#FAFAFA',e:'#014DF9',h:'#FAFAFA',s:'#d8e1f7',k:INK};
function elephant(pose='stand',cell=6){return sprite(elePose(pose),ELE_PAL,cell);}
function place(node,l,t,z,parent){const d=el('div','abs',`left:${l}px;top:${t}px;${z?'z-index:'+z:''}`,null,parent);d.appendChild(node);return d;}

/* ───────── 世界层 ───────── */
function world(type,ox,{oy=0,parent}={}){ // type: color | raw ; ox = 世界横向偏移（1x 像素）
  if(type==='raw') return img('px/world-raw.png',`position:absolute;left:${-ox}px;top:${-oy}px;width:3248px;height:1088px`,parent);
  return img('px/world-color.png',`position:absolute;left:${-ox}px;top:${-oy}px;width:3240px;height:1080px`,parent);
}
function foreground(ox,dy=330,parent){return img('px/fg-foliage.png',`position:absolute;left:${-ox*1.4}px;top:${dy}px;width:3240px;height:1080px;z-index:40`,parent);}
function haze(css,parent){return el('div','abs',`left:0;top:0;width:1920px;height:1080px;${css}`,null,parent);}

/* 真实转录（第 2 期样片，测试模式截图里的剪辑直播转录） */
const LINE=[{c:'他就',bad:1},...'他就建议我少喝饮料每天喝两瓶饮料以上的人'].concat([{c:'呃',bad:1},...'风险会明显变高想要的朋友呢就在评论区留言']);
const LINE2='想要的朋友呢就在评论区留言他就建议我少喝饮料每天喝两瓶饮料以上的人风险会明显变高';
/* 地面：mode 决定每块砖的状态 */
function ground({x0=0,y=840,from=0,count=34,mode='text',rawFrom=99999,monsters=true,gapAt=null,closed=false,second=true,parent,soilRaw=false,skipBad=false,secondX0=null}={}){
  const g=el('div','abs',`left:0;top:0;width:1920px;height:1080px;z-index:10`,null,parent);
  const rnd=seeded(7);
  let i=from,x=x0, n=0;
  const seq=skipBad?LINE.filter(t=>!(t.bad)):LINE;
  while(n<count){
    const t=seq[i%seq.length]; i++; n++;
    if(typeof t==='object'){ // 口误小怪
      const w=t.c.length*60;
      if(x>=rawFrom){ for(let q=0;q<t.c.length;q++){const tl=el('div','tile raw',`left:${x+q*60}px;top:${y}px`,'',g); el('div','abs',`left:24px;top:12px;width:12px;height:36px;background:#5d626b`,null,tl);} x+=w; continue; }
      if(monsters){const m=el('div','mon',`left:${x}px;top:${y+6}px;width:${w}px`,t.c,g); m.innerHTML+=`<i class="eye" style="left:${w/2-27}px"></i><i class="eye" style="left:${w/2+15}px"></i><i class="fang" style="left:12px"></i><i class="fang" style="left:${w/2-3}px"></i><i class="fang" style="right:12px"></i>`; m.dataset.bad=t.c;}
      x+=w; continue;
    }
    const isRaw=(x>=rawFrom);
    const tile=el('div','tile'+(isRaw?' raw':''),`left:${x}px;top:${y}px`,isRaw?'':t,g);
    if(isRaw){ // 原始音频波形砖
      const hgt=6+Math.round(rnd()*7)*6; el('div','abs',`left:24px;top:${30-hgt/2}px;width:12px;height:${hgt}px;background:#5d626b`,null,tile);
    }
    x+=60;
  }
  if(second){ // 第二行：下一句转录，淡
    const sx0=secondX0??x0;
    [...LINE2+LINE2].forEach((ch,j)=>{ if(sx0+j*60>2400||sx0+j*60<-60)return; el('div','tile dim',`left:${sx0+j*60}px;top:${y+60}px`,soilRaw?'':ch,g).className+=soilRaw?' raw':'';});
  }
  el('div','soil'+(soilRaw?' raw':''),`left:-240px;top:${y+120}px;width:2640px`,null,g);
  return g;
}

/* HUD */
function hudbar({time='2:12',bad='0/2',yen='0.00',check=0,checkText=false,stage='v1',flash=null}={}){
  const b=el('div','hudbar',null,null,hud);
  b.innerHTML=`<div class="brand"><img src="../../assets/brand/logo.svg">明知AI剪辑 <small>(Mingzhi · MIT)</small></div>
  <div class="it ${flash==='time'?'flash':''}"><span class="k">TIME</span><span class="v">${time}</span></div>
  <div class="it ${flash==='bad'?'flash':''}"><span class="k zh">口误</span><span class="v">${bad}</span></div>
  <div class="it"><span class="k">¥</span><span class="v">${yen}</span></div>
  <div class="it ${flash==='check'?'flash':''}"><span class="k">CHECK</span><span class="pips">${Array.from({length:7},(_,i)=>`<b class="${i<check?'on':''}"></b>`).join('')}</span>${checkText?`<span class="v">${check}/7</span>`:''}</div>
  <div class="it ${flash==='stage'?'flash':''}"><span class="k">STAGE</span><span class="v">${stage}</span></div>`;
  return b;
}
function bigPanel(l,t,w,inner,{sh=true,parent}={}){
  const p=el('div','panel step',`left:${l}px;top:${t}px;width:${w}px;padding:30px 40px 32px`,inner,parent);
  if(sh){requestAnimationFrame(()=>{});const s=el('div','panel-sh step',`left:${l+12}px;top:${t+12}px;width:${w}px;height:0`,null,parent); s.dataset.follow='1'; s._p=p;}
  return p;
}
function fixShadows(){document.querySelectorAll('.panel-sh').forEach(s=>{if(s._p)s.style.height=s._p.offsetHeight+'px';});}
function trail(P0,P1,P2,n=10,parent,skipEnd=1){const t=el('div','trail abs','left:0;top:0;z-index:25',null,parent);for(let i=1;i<n-skipEnd+1;i++){const u=i/n;const x=(1-u)**2*P0[0]+2*(1-u)*u*P1[0]+u*u*P2[0],y=(1-u)**2*P0[1]+2*(1-u)*u*P1[1]+u*u*P2[1];el('b',null,`left:${Math.round(x/6)*6}px;top:${Math.round(y/6)*6}px`,null,t);}return t;}
function burst(cx,cy,parent,s=1){const b=el('div','burst abs',`left:${cx}px;top:${cy}px;z-index:26`,null,parent);[[-72,-6,30,6],[54,-6,30,6],[-54,-42,6,18],[60,-42,6,18],[-60,24,18,6],[48,24,18,6]].forEach(a=>el('b',null,`left:${a[0]*s}px;top:${a[1]*s}px;width:${a[2]}px;height:${a[3]}px`,null,b));return b;}
function dust(x,y,parent){[[0,0,18],[-30,6,12],[36,6,12],[-54,12,6],[60,12,6]].forEach(([dx,dy,s])=>el('div','abs',`left:${x+dx}px;top:${y+dy}px;width:${s}px;height:${s}px;background:#fff;outline:3px solid ${INK};z-index:24`,null,parent));}
