<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<!--
  剪辑前后对比的前景层（1920×1200，透明洞 + 标签），视频由 compare.sh 用 ffmpeg 垫在洞下面。
  参数：?kind=landscape|portrait&a=原片时长&b=成片时长&note=底部一行说明&bg=背景名
  洞的位置与 compare.sh 里的 LAYOUT 一一对应，改一处必须改另一处。
-->
<style>
  html, body { width: 1920px; height: 1200px; background: transparent; }
  svg.mask { position: absolute; inset: 0; }
  .hole { position: absolute; border-radius: 22px; box-shadow: inset 0 0 0 1px #ffffff1f; }
  .lab { position: absolute; display: flex; align-items: baseline; gap: 14px; color: #ffffffd9; }
  .lab b { font: 600 30px/1 var(--sans); letter-spacing: 0.02em; }
  .lab .it { font-size: 46px; line-height: 1; color: #fff; }
  .lab .meta { font: 400 21px/1 var(--mono); color: #ffffff73; letter-spacing: 0.04em; }
  .lab.out b { color: #a9bdf0; }
  .lab.out .it { color: #c9d6f7; }
  .arrow { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 14px; color: #ffffff59; }
  .arrow svg { width: 64px; height: 64px; }
  .arrow span { font: 400 19px/1.3 var(--mono); letter-spacing: 0.06em; text-align: center; }
  .note { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 400 23px/1 var(--sans); color: #ffffff8c; letter-spacing: 0.02em; }
  .note i { font-style: normal; color: #ffffff3d; margin: 0 12px; }
  .brand { z-index: 2; position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 14px; font: 600 24px/1 var(--sans); color: #ffffffd9; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .brand .it { font-size: 26px; color: #ffffff80; font-weight: 300; }
  .track { position: absolute; height: 4px; border-radius: 2px; background: #ffffff1a; }
</style></head>
<body>
<div class="brand"><img src="../../../assets/brand/logo-64.png" alt="">明知AI剪辑 <span class="it">before / after</span></div>
<div id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'landscape';
  // 与 compare.sh 的 LAYOUT 相同：[x, y, w, h]
  const L = kind === 'landscape'
    ? { a: [112, 321, 1056, 594], b: [1296, 170, 504, 896] }
    : { a: [316, 170, 504, 896], b: [1100, 170, 504, 896] };
  const s = document.getElementById('stage');
  const box = ([x, y, w, h]) => `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  const lab = (r, cls, name, dur, meta) =>
    `<div class="lab ${cls}" style="left:${r[0]}px;top:${r[1] - 64}px"><b>${name}</b><span class="it l">${dur}</span><span class="meta">${meta}</span></div>`;
  const track = (r) => `<div class="track" style="left:${r[0]}px;top:${r[1] + r[3] + 22}px;width:${r[2]}px"></div>`;
  const mid = [L.a[0] + L.a[2], L.b[0]];
  const midY = L.b[1] + L.b[3] / 2;
  // 一整块深色底，挖掉两个圆角矩形（evenodd），视频从洞里露出来
  const R = 22;
  const rr = ([x, y, w, h]) => `M${x + R} ${y}H${x + w - R}A${R} ${R} 0 0 1 ${x + w} ${y + R}V${y + h - R}A${R} ${R} 0 0 1 ${x + w - R} ${y + h}H${x + R}A${R} ${R} 0 0 1 ${x} ${y + h - R}V${y + R}A${R} ${R} 0 0 1 ${x + R} ${y}Z`;
  s.innerHTML = `
    <svg class="mask" width="1920" height="1200"><path fill="#0c0d10" fill-rule="evenodd" d="M0 0H1920V1200H0Z ${rr(L.a)} ${rr(L.b)}"/></svg>
    <div class="hole" style="${box(L.a)}"></div><div class="hole" style="${box(L.b)}"></div>
    ${lab(L.a, '', '原片', q.get('a'), kind === 'landscape' ? '16:9 · 1280×720' : '9:16 · 720×1280')}
    ${lab(L.b, 'out', '成片', q.get('b'), '9:16 · 1080×1920')}
    ${track(L.a)}${track(L.b)}
    <div class="arrow" style="left:${(mid[0] + mid[1]) / 2 - 60}px;width:120px;top:${midY - 60}px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      <span>同步<br>播放</span>
    </div>
    <div class="note">${(q.get('note') || '').split('|').join('<i>/</i>')}</div>`;
</script>
</body></html>
