[package]
name = "mingzhi-launcher"
version = "0.1.0"
edition = "2021"
# File::try_lock（单实例锁）需要 1.89
rust-version = "1.89"
description = "明知AI剪辑 启动器：下载、续传、校验、解包、进度页与启动工作台"
license = "MIT"
publish = false

[lib]
name = "mingzhi_launcher"
path = "src/lib.rs"

[[bin]]
name = "mingzhi-launcher"
path = "src/main.rs"

# 依赖版本全部钉死（=），保证各平台 CI 构建结果一致
[dependencies]
# 只开 rustls（ring），不带 gzip 等多余特性
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
sha2 = "=0.10.9"
tar = "=0.4.46"
zstd = "=0.13.3"
flate2 = "=1.1.10"
# static：干净机器上没有 Homebrew 的 liblzma，必须静态链接
xz2 = { version = "=0.1.7", features = ["static"] }
# 只需要 deflate（Chrome / Windows 版 Node 的 zip 都是 deflate）
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# 进度页的本机 HTTP 服务（只听 127.0.0.1）
tiny_http = "=0.12.0"

# 终端信号（Ctrl+C、关闭终端窗口）→ 优雅退出
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# Windows：Job Object（子进程树随启动器退出）与启动失败时的弹窗
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows 资源（图标、版本信息）：build.rs 里按编译目标决定是否嵌入
[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
